name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    # Hosted runners have neither ROCm nor a gfx1151: clippy and the Cargo
    # tests run in tools/ci/check-rust.sh on the development host.
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Unsafe policy
        run: python3 tools/ci/check-unsafe.py

      - name: Tool tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/tools/ab_test.py tests/tools/gate_scope_test.py \
            tests/tools/kernel_resources_test.py tests/tools/prof_test.py \
            tests/tools/serving_bench_test.py tests/tools/speculative_corpus_test.py \
            tests/tools/check_pr_title_test.py tests/tools/check_docs_test.py \
            tests/tools/check_dependencies_test.py tests/models/deepseek_v4_flash/dataset_test.py; do
            echo "== $test"
            PYTHONDONTWRITEBYTECODE=1 python3 "$test"
          done

      # Host-only checks of the functional runner and its checkers; the suites
      # themselves run against target/release/gufo on the gfx1151.
      - name: Functional suite selection, runner and cache workloads
        run: |
          for pattern in test_impact.py test_runner.py test_cache_workloads.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/functional -p "$pattern"
          done

      - name: Documentation and dependency inventory
        run: |
          python3 tools/ci/check-docs.py --root .
          python3 tools/ci/check-dependencies.py

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false

      - name: Formatting of the hand-written C++
        run: nix shell --inputs-from . nixpkgs#clang-tools -c python3 tools/ci/check-format.py
