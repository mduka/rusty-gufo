]

[[launcher]]
name = "head_rms_norm"
cpp = "HeadRmsNorm"
returns = "void"
doc = "Each head row of `x` divided by its root mean square, in place."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "n_tok * n_head * head_dim" },
  { name = "n_tok", kind = "scalar", type = "u32" },
  { name = "n_head", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["n_tok * n_head <= 4294967295"]
probes = [
  { n_tok = 2, n_head = 64, head_dim = 512, eps = 1e-6 },
]

[[launcher]]
name = "head_rms_norm_rope_tail"
cpp = "HeadRmsNormRopeTail"
returns = "supported"
doc = "head_rms_norm fused with rope_tail for wide prefill (at least 96 tokens); otherwise unsupported."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "n_tok * n_head * head_dim" },
  { name = "n_tok", kind = "scalar", type = "u32" },
  { name = "n_head", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "n_rot", kind = "scalar", type = "u32" },
  { name = "pos0", kind = "scalar", type = "u32" },
  { name = "n_ctx_orig", kind = "scalar", type = "u32" },
  { name = "inverse", kind = "scalar", type = "bool" },
  { name = "freq_base", kind = "scalar", type = "f32" },
  { name = "freq_scale", kind = "scalar", type = "f32" },
  { name = "ext_factor", kind = "scalar", type = "f32" },
  { name = "attn_factor", kind = "scalar", type = "f32" },
  { name = "beta_fast", kind = "scalar", type = "f32" },
  { name = "beta_slow", kind = "scalar", type = "f32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["n_rot <= head_dim", "n_rot % 2 == 0", "head_dim >= 1", "head_dim <= 512", "n_tok * n_head <= 4294967295"]
probes = [
  { n_tok = 96, n_head = 64, head_dim = 512, n_rot = 64, pos0 = 7, n_ctx_orig = 65536, inverse = false, freq_base = 10000.0, freq_scale = 0.025, ext_factor = 1.0, attn_factor = 1.0, beta_fast = 32.0, beta_slow = 1.0, eps = 1e-6 },
]

[[launcher]]
name = "rope_tail"
cpp = "RopeTail"
returns = "void"
doc = "Rotary embedding of the last `n_rot` values of each head row, in place; row `t` at position `pos0 + t * pos_stride`."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "n_tok * n_head * head_dim" },
  { name = "n_tok", kind = "scalar", type = "u32" },
  { name = "n_head", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "n_rot", kind = "scalar", type = "u32" },
  { name = "pos0", kind = "scalar", type = "u32" },
  { name = "pos_stride", kind = "scalar", type = "u32" },
  { name = "n_ctx_orig", kind = "scalar", type = "u32" },
  { name = "inverse", kind = "scalar", type = "bool" },
  { name = "freq_base", kind = "scalar", type = "f32" },
  { name = "freq_scale", kind = "scalar", type = "f32" },
  { name = "ext_factor", kind = "scalar", type = "f32" },
  { name = "attn_factor", kind = "scalar", type = "f32" },
