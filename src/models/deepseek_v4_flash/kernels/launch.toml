  { n_tok = 3, n_head = 64, head_dim = 512, n_rot = 64, pos0 = 11, pos_stride = 1, n_ctx_orig = 65536, inverse = false, freq_base = 10000.0, freq_scale = 0.025, ext_factor = 1.0, attn_factor = 1.0, beta_fast = 32.0, beta_slow = 1.0 },
]

