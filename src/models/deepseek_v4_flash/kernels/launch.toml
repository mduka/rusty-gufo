# Attention. Heads and queries are `n_tokens` rows of `n_head * head_dim`;
# the raw ring holds `raw_cap` rows of `head_dim`, the compressed cache
# `n_comp` (absent compressed rows pass the raw rows with `n_comp = 0`);
# masks are `n_tokens` rows of `n_comp`, top-k lists `n_tokens` rows of
# `top_k` indices, which the kernels skip outside the visible rows. Every
# kernel bounds its raw rows to 256 and its score tables itself, except
# where `requires` says.

