# Sources and launchers of DeepSeek V4 Flash (docs/RUST.md). The kernels and their launchers form one translation
# unit, `backend.hip.cpp`, beside the vendored MMQ tier. The flags and
# defines are those of the C++ build (CMakeLists.txt and the HIP targets).

[library]
name = "deepseek_v4_flash"
root = "../../../.."
namespace = "gufo::models::deepseek_v4_flash"
f16_type = "__half"
headers = [
  "src/models/deepseek_v4_flash/kernels/rocm/launch.hpp",
]

[[source]]
path = "src/models/deepseek_v4_flash/kernels/rocm/backend.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
defines = ["USE_PROF_API=1", "_GNU_SOURCE", "__HIP_ROCclr__=1"]

# The quantized matmul tier adapted from llama.cpp keeps its C++17 dialect.
[[source]]
path = "src/models/deepseek_v4_flash/kernels/rocm/mmq/ds4_ggml_stubs.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["DS4_ROCM_WMMA_MMQ_Y=64", "GGML_HIP_NO_VMM", "GGML_USE_HIP", "USE_PROF_API=1", "__HIP_ROCclr__=1"]

[[source]]
path = "src/models/deepseek_v4_flash/kernels/rocm/mmq/ds4_mmq.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["DS4_ROCM_WMMA_MMQ_Y=64", "GGML_HIP_NO_VMM", "GGML_USE_HIP", "USE_PROF_API=1", "__HIP_ROCclr__=1"]

[[source]]
path = "src/models/deepseek_v4_flash/kernels/rocm/mmq/ds4_mmq_d2r.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["DS4_ROCM_WMMA_MMQ_Y=64", "GGML_HIP_NO_VMM", "GGML_USE_HIP", "USE_PROF_API=1", "__HIP_ROCclr__=1"]

[[source]]
