# Generated launchers: the ds4 kernels on device pointers and the backend's
# stream. Extents are element
# counts. Trusted base: a wrong extent compiles and lets a kernel overrun its
# buffer; review changes like unsafe code. Every launcher needs probes.

[[launcher]]
name = "rms_norm_plain_rows"
cpp = "RmsNormPlainRows"
returns = "void"
doc = "Each of `rows` rows of `n` values divided by its root mean square."
params = [
  { name = "out", kind = "out", elem = "f32", len = "n * rows" },
  { name = "x", kind = "in", elem = "f32", len = "n * rows" },
  { name = "n", kind = "scalar", type = "u32" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
probes = [
  { n = 16384, rows = 2, eps = 1e-6 },
  { n = 4096, rows = 3, eps = 1e-6 },
]

[[launcher]]
name = "rms_norm_plain_rows_in_place"
cpp = "RmsNormPlainRows"
returns = "void"
doc = "rms_norm_plain_rows over `out` in place."
params = [
  { name = "out", kind = "inout", elem = "f32", len = "n * rows" },
  { name = "x", kind = "alias", of = "out", elem = "f32", read_only = true },
  { name = "n", kind = "scalar", type = "u32" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
probes = [
  { n = 16384, rows = 2, eps = 1e-6 },
  { n = 4096, rows = 1, eps = 1e-6 },
]

[[launcher]]
name = "rms_norm_weight_rows"
cpp = "RmsNormWeightRows"
returns = "void"
doc = "rms_norm_plain_rows times an F32 weight row."
params = [
  { name = "out", kind = "out", elem = "f32", len = "n * rows" },
  { name = "x", kind = "in", elem = "f32", len = "n * rows" },
  { name = "w", kind = "in", elem = "f32", len = "n" },
  { name = "n", kind = "scalar", type = "u32" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
probes = [
  { n = 4096, rows = 1, eps = 1e-6 },
  { n = 1024, rows = 5, eps = 1e-6 },
]

[[launcher]]
name = "rms_norm_weight_rows_in_place"
cpp = "RmsNormWeightRows"
returns = "void"
doc = "rms_norm_weight_rows over `out` in place."
params = [
  { name = "out", kind = "inout", elem = "f32", len = "n * rows" },
  { name = "x", kind = "alias", of = "out", elem = "f32", read_only = true },
  { name = "w", kind = "in", elem = "f32", len = "n" },
  { name = "n", kind = "scalar", type = "u32" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
probes = [
  { n = 4096, rows = 2, eps = 1e-6 },
]

[[launcher]]
