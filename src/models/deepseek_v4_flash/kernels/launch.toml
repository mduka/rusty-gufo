# --- Routed experts ------------------------------------------------------------
# The route plan (counts, offsets, the pairs sorted by expert and the expert
# tiles) derives from one generation of the selection; a kernel that reads
# `sorted[offsets[e] + r]` for `r < counts[e]` relies on the three agreeing,
# which the derivation guarantees. Plan buffers hold `rows_cap * 6` pairs
# whatever the call uses, so pair values stay below that capacity.

