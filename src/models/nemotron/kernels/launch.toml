# Kernel contract for the Nemotron-H kernels (docs/development/DESIGN.md).
# Extents are element counts (bytes for `bytes`); the C++ launchers are the
# flat adapters of rocm/adapters.hpp, which take `hipStream_t` last. Trusted
# base: a wrong extent compiles and lets a kernel overrun its buffer. Review
# changes like unsafe code; every launcher needs probes (tests/extents.rs).
#
# Block sizes: Q8_0 34 bytes per 32 values, IQ2_XXS 66 per 256, NVFP4 36 per
# 64, Q8_1 activations 36 per 32.
#
# The per-sequence (`*_rows`) launchers take one buffer per row as a list;
# the adapter copies the device pointers into `device_tables` (pageable,
# stream ordered) before the launch, so they can't be recorded in a graph.

[library]
name = "nemotron"
root = "../../../.."
namespace = "gufo::models::nemotron::rocm::flat"
headers = [
  "src/models/nemotron/kernels/rocm/adapters.hpp",
]

# The extension's CMake target gufo_nemotron_hip: -O3 over the preset's -O2.
[[source]]
path = "src/models/nemotron/kernels/rocm/drafter_kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/nemotron/kernels/rocm/gemm.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/nemotron/kernels/rocm/gemv.hip"
