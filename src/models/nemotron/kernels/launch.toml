[[source]]
path = "src/models/nemotron/kernels/rocm/kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/nemotron/kernels/rocm/sample.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/nemotron/kernels/rocm/vision.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/nemotron/kernels/rocm/adapters.hip"

[[source]]
path = "src/models/nemotron/kernels/rocm/adapters_drafter.hip"

# gufo_nemotron_mmq: the quantized tier adapted from llama.cpp keeps its C++17
# dialect, fast math and upstream style (kernels/rocm/mmq/VENDOR.md).
