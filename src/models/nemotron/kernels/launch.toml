# --- Trunk (kernels.hpp) -------------------------------------------------------

[[launcher]]
name = "embed_q8_0"
cpp = "EmbedQ8_0"
returns = "supported"
doc = "`x[t]` = dequantized Q8_0 row `tokens[t]` of the embedding table (`vocab` rows of `hidden` values)."
params = [
  { name = "table", kind = "in", elem = "bytes", len = "vocab * (hidden / 32) * 34" },
  { name = "tokens", kind = "indices", signed = true, len = "n_tokens", below = "vocab" },
  { name = "x", kind = "out", elem = "f32", len = "n_tokens * hidden" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "hidden", kind = "scalar", type = "usize" },
  { name = "vocab", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["n_tokens >= 1", "hidden >= 32", "hidden % 32 == 0"]
probes = [
  { n_tokens = 3, hidden = 2688, vocab = 5 },
  { n_tokens = 1, hidden = 32, vocab = 1 },
]

[[launcher]]
name = "rms_norm"
cpp = "RmsNorm"
returns = "supported"
doc = "`out[r] = x[r] / sqrt(mean(x[r]^2) + eps) * w`."
params = [
  { name = "x", kind = "in", elem = "f32", len = "rows * width" },
  { name = "w", kind = "in", elem = "f32", len = "width" },
  { name = "out", kind = "out", elem = "f32", len = "rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1"]
probes = [
  { rows = 3, width = 2688, eps = 1e-05 },
  { rows = 1, width = 1, eps = 1e-05 },
]

[[launcher]]
name = "rms_norm_f16"
cpp = "RmsNormF16"
returns = "supported"
doc = "`rms_norm` with the F32 result rounded to FP16 (nearest even) as it stores."
params = [
  { name = "x", kind = "in", elem = "f32", len = "rows * width" },
  { name = "w", kind = "in", elem = "f32", len = "width" },
  { name = "out", kind = "out", elem = "f16", len = "rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1"]
probes = [
  { rows = 3, width = 2688, eps = 1e-05 },
  { rows = 1, width = 1, eps = 1e-05 },
]

[[launcher]]
name = "rms_norm_q8"
cpp = "RmsNormQ8"
returns = "supported"
doc = "RMSNorm of short chunks writing F32 rows to `out` and/or Q8_1 rows to `q8` (either may be absent)."
params = [
  { name = "x", kind = "in", elem = "f32", len = "rows * width" },
  { name = "w", kind = "in", elem = "f32", len = "width" },
  { name = "out", kind = "out", elem = "f32", len = "rows * width", optional = true },
  { name = "q8", kind = "out", elem = "bytes", len = "rows * (width / 32) * 36", optional = true },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1", "width >= 128", "width <= 4096", "width % 128 == 0"]
probes = [
  { rows = 3, width = 2688, eps = 1e-05, with = ["out", "q8"] },
  { rows = 1, width = 128, eps = 1e-05, with = ["q8"] },
]

[[launcher]]
name = "quantize_q8_1"
cpp = "QuantizeQ8_1"
returns = "supported"
doc = "`x` rows to Q8_1 rows."
params = [
  { name = "x", kind = "in", elem = "f32", len = "rows * width" },
  { name = "q8", kind = "out", elem = "bytes", len = "rows * (width / 32) * 36" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
]
requires = ["rows >= 1", "width >= 128", "width <= 4096", "width % 128 == 0"]
probes = [
  { rows = 3, width = 4096 },
  { rows = 1, width = 128 },
]

[[launcher]]
name = "add_scaled"
cpp = "AddScaled"
returns = "supported"
doc = "`x[i] += scale * a[i]` (`+ b[i]` when `b` is present)."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "n" },
  { name = "a", kind = "in", elem = "f32", len = "n" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "b", kind = "in", elem = "f32", len = "n", optional = true },
  { name = "n", kind = "scalar", type = "usize" },
]
requires = ["n >= 1"]
probes = [
  { scale = 0.5, n = 1000, with = ["b"] },
  { scale = 1.0, n = 1 },
]

[[launcher]]
name = "relu2"
cpp = "Relu2"
returns = "supported"
doc = "`max(x, 0)^2` in place."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "n" },
  { name = "n", kind = "scalar", type = "usize" },
]
requires = ["n >= 1"]
probes = [
  { n = 1000 },
  { n = 1 },
]

[[launcher]]
name = "mamba_conv"
cpp = "MambaConv"
returns = "supported"
doc = "Mamba-2 causal depthwise convolution with SiLU over the x|B|C channels of `proj` rows (from `xbc_offset`, times `in_scale`); `state` holds `kernel - 1` rows of earlier raw scaled inputs."
params = [
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "xbc_offset", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "channels * kernel" },
  { name = "bias", kind = "in", elem = "f32", len = "channels" },
  { name = "state", kind = "in", elem = "f32", len = "(kernel - 1) * channels" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * channels" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "channels", kind = "scalar", type = "usize" },
  { name = "kernel", kind = "scalar", type = "usize" },
]
requires = ["n_tokens >= 1", "channels >= 1", "kernel >= 1", "xbc_offset + channels <= stride"]
probes = [
  { stride = 40, xbc_offset = 8, in_scale = 0.5, n_tokens = 5, channels = 32, kernel = 4 },
  { stride = 1, xbc_offset = 0, in_scale = 1.0, n_tokens = 1, channels = 1, kernel = 1 },
]

[[launcher]]
name = "mamba_conv_state"
cpp = "MambaConvState"
returns = "supported"
doc = "Shifts the last `kernel - 1` raw inputs of this chunk into `state`."
params = [
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "xbc_offset", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "state", kind = "inout", elem = "f32", len = "(kernel - 1) * channels" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "channels", kind = "scalar", type = "usize" },
  { name = "kernel", kind = "scalar", type = "usize" },
]
requires = ["n_tokens >= 1", "channels >= 1", "kernel >= 2", "kernel <= 9", "xbc_offset + channels <= stride"]
probes = [
  { stride = 40, xbc_offset = 8, in_scale = 0.5, n_tokens = 2, channels = 32, kernel = 4 },
  { stride = 3, xbc_offset = 2, in_scale = 1.0, n_tokens = 1, channels = 1, kernel = 9 },
]

[[launcher]]
name = "mamba_scan"
cpp = "MambaScan"
returns = "supported"
doc = "Selective scan with a scalar decay per head, token by token (`MambaScanArgs` without row states); d_state 128, head_dim 64. `state` is `[head][128][64]`; with `write_state` false it is left as it was."
params = [
  { name = "xbc", kind = "in", elem = "f32", len = "n_tokens * channels" },
  { name = "channels", kind = "scalar", type = "usize" },
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "dt_offset", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "dt_bias", kind = "in", elem = "f32", len = "heads" },
  { name = "a", kind = "in", elem = "f32", len = "heads" },
  { name = "d", kind = "in", elem = "f32", len = "heads" },
  { name = "state", kind = "inout", elem = "f32", len = "heads * 128 * 64" },
  { name = "y", kind = "out", elem = "f32", len = "n_tokens * heads * 64" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "heads", kind = "scalar", type = "usize" },
  { name = "head_dim", kind = "scalar", type = "usize" },
  { name = "groups", kind = "scalar", type = "usize" },
  { name = "write_state", kind = "scalar", type = "bool" },
]
requires = ["n_tokens >= 1", "heads >= 1", "head_dim == 64", "groups >= 1", "heads % groups == 0", "channels % 4 == 0", "heads * 64 + 2 * groups * 128 <= channels", "dt_offset + heads <= stride"]
probes = [
  { channels = 1536, stride = 1600, dt_offset = 1550, in_scale = 1.0, n_tokens = 9, heads = 16, head_dim = 64, groups = 2, write_state = true },
  { channels = 320, stride = 1, dt_offset = 0, in_scale = 1.0, n_tokens = 1, heads = 1, head_dim = 64, groups = 1, write_state = false },
]

[[launcher]]
name = "mamba_gate_norm_q8"
cpp = "MambaGateNormQ8"
returns = "supported"
doc = "`mamba_gate_norm` for short chunks into Q8_1 rows of `inner` values; groups hold 1024 values."
params = [
  { name = "y", kind = "in", elem = "f32", len = "n_tokens * inner" },
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "inner" },
  { name = "q8", kind = "out", elem = "bytes", len = "n_tokens * (inner / 32) * 36" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "inner", kind = "scalar", type = "usize" },
  { name = "groups", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["n_tokens >= 1", "groups >= 1", "inner == groups * 1024", "stride % 4 == 0", "inner <= stride"]
probes = [
  { stride = 4096, in_scale = 1.0, n_tokens = 3, inner = 4096, groups = 4, eps = 1e-05 },
  { stride = 1024, in_scale = 1.0, n_tokens = 1, inner = 1024, groups = 1, eps = 1e-05 },
]

[[launcher]]
name = "mamba_gate_norm"
cpp = "MambaGateNorm"
returns = "supported"
doc = "`y = RMSNorm per group(y * silu(z * in_scale)) * w` in place; z is the first `inner` floats of each `proj` row."
params = [
  { name = "y", kind = "inout", elem = "f32", len = "n_tokens * inner" },
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "inner" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "inner", kind = "scalar", type = "usize" },
  { name = "groups", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["n_tokens >= 1", "groups >= 1", "inner % groups == 0", "inner <= stride"]
probes = [
  { stride = 4100, in_scale = 1.0, n_tokens = 3, inner = 4096, groups = 8, eps = 1e-05 },
  { stride = 1, in_scale = 1.0, n_tokens = 1, inner = 1, groups = 1, eps = 1e-05 },
]

[[launcher]]
name = "mamba_gate_norm_f16"
cpp = "MambaGateNormF16"
returns = "supported"
doc = "`mamba_gate_norm` storing the result to `out` rounded to FP16; `y` keeps the gated values."
params = [
  { name = "y", kind = "inout", elem = "f32", len = "n_tokens * inner" },
  { name = "proj", kind = "in", elem = "f32", len = "n_tokens * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "inner" },
  { name = "out", kind = "out", elem = "f16", len = "n_tokens * inner" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "inner", kind = "scalar", type = "usize" },
  { name = "groups", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["n_tokens >= 1", "groups >= 1", "inner % groups == 0", "inner <= stride"]
probes = [
  { stride = 4100, in_scale = 1.0, n_tokens = 3, inner = 4096, groups = 8, eps = 1e-05 },
  { stride = 1, in_scale = 1.0, n_tokens = 1, inner = 1, groups = 1, eps = 1e-05 },
]

[[launcher]]
name = "kv_append"
cpp = "KvAppend"
returns = "supported"
doc = "Stores `n_tokens` rows of K and V as half at positions `pos[0]..pos[0] + n_tokens` of caches with `capacity` rows."
params = [
  { name = "k", kind = "in", elem = "f32", len = "n_tokens * kv_dim" },
  { name = "v", kind = "in", elem = "f32", len = "n_tokens * kv_dim" },
  { name = "k_cache", kind = "inout", elem = "f16", len = "capacity * kv_dim" },
  { name = "v_cache", kind = "inout", elem = "f16", len = "capacity * kv_dim" },
  { name = "pos", kind = "indices", signed = true, len = "1", below = "capacity - n_tokens + 1" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "kv_dim", kind = "scalar", type = "usize" },
  { name = "capacity", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["n_tokens >= 1", "kv_dim >= 1", "n_tokens <= capacity", "capacity <= 1073741824"]
probes = [
  { n_tokens = 3, kv_dim = 256, capacity = 9 },
  { n_tokens = 1, kv_dim = 1, capacity = 1 },
]

[[launcher]]
name = "attention"
cpp = "Attention"
returns = "supported"
doc = "Causal GQA on FP16 WMMA for queries at `pos[0]..pos[0] + n_tokens` over cache positions up to each query; head_dim 128, 16 query heads per KV head."
params = [
  { name = "q", kind = "in", elem = "f32", len = "n_tokens * heads * 128" },
  { name = "k_cache", kind = "in", elem = "f16", len = "capacity * kv_heads * 128" },
  { name = "v_cache", kind = "in", elem = "f16", len = "capacity * kv_heads * 128" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * heads * 128" },
  { name = "pos", kind = "indices", signed = true, len = "1", below = "capacity - n_tokens + 1" },
  { name = "n_tokens", kind = "scalar", type = "usize" },
  { name = "heads", kind = "scalar", type = "usize" },
  { name = "kv_heads", kind = "scalar", type = "usize" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "capacity", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["n_tokens >= 1", "kv_heads >= 1", "heads == kv_heads * 16", "n_tokens <= capacity", "capacity <= 1073741824"]
probes = [
  { n_tokens = 9, heads = 32, kv_heads = 2, scale = 0.088, capacity = 70 },
  { n_tokens = 1, heads = 16, kv_heads = 1, scale = 1.0, capacity = 1 },
]

[[launcher]]
name = "attention_short"
cpp = "AttentionShort"
returns = "supported"
doc = "`attention` for chunks of up to 8 queries with the keys split over 64 blocks per KV head, merged after; `partial` holds `n_tokens * heads * 64 * 130` floats."
params = [
  { name = "q", kind = "in", elem = "f32", len = "n_tokens * heads * 128" },
