[[launcher]]
name = "mamba_conv_rows"
cpp = "MambaConvRows"
returns = "supported"
doc = "`mamba_conv` then `mamba_conv_state` of a one-token chunk for each of `rows` sequences: row r of `proj` is sequence r's token and `states[r]` its history (`kernel - 1` rows); the table of `states` goes through `device_tables`."
params = [
  { name = "proj", kind = "in", elem = "f32", len = "rows * stride" },
  { name = "stride", kind = "scalar", type = "usize" },
  { name = "xbc_offset", kind = "scalar", type = "usize" },
  { name = "in_scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "channels * kernel" },
  { name = "bias", kind = "in", elem = "f32", len = "channels" },
  { name = "states", kind = "inout", elem = "f32", list = "rows", len = "(kernel - 1) * channels" },
  { name = "device_tables", kind = "out", elem = "bytes", len = "rows * 8" },
  { name = "out", kind = "out", elem = "f32", len = "rows * channels" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "channels", kind = "scalar", type = "usize" },
  { name = "kernel", kind = "scalar", type = "usize" },
]
requires = ["rows >= 1", "channels >= 1", "kernel >= 2", "kernel <= 9", "xbc_offset + channels <= stride"]
probes = [
  { stride = 40, xbc_offset = 8, in_scale = 0.5, rows = 3, channels = 32, kernel = 4 },
  { stride = 3, xbc_offset = 2, in_scale = 1.0, rows = 1, channels = 1, kernel = 9 },
]

[[launcher]]
name = "mamba_scan_rows"
