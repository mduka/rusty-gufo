# SLP vectorization puts the K-quant scales and offsets of the blocked
# prefill GEMMs into wide register tuples. With clang 23 the Q3_K and Q6_K
# 128x128 tiles then spill, so the two units build without it.
[[source]]
path = "src/models/qwen/hip/kernels/prefill_quant_gemm.hip"
flags = ["-fno-slp-vectorize"]

