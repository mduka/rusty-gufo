[[launcher]]
name = "dflash_selector_sampled"
cpp = "LaunchDFlashSelectorSampledFlat"
returns = "void"
doc = "Sampled DFlash2 token path of `count` proposal rows at `temperature` with one draw per row, chained from the anchor, and each row's top-k candidates with their probabilities. Repeat, frequency and presence penalties evolve across the chain."
requires = ["count > 0", "selector_rank > 0", "selector_top_k > 0", "selector_top_k <= 16", "selector_top_k <= vocab_size"]
params = [
  { name = "logits", kind = "in", elem = "f32", len = "count * vocab_size" },
  { name = "projected_hidden", kind = "in", elem = "f32", len = "count * selector_rank" },
  { name = "predecessor_codebook", kind = "in", elem = "bf16", len = "vocab_size * selector_rank" },
  { name = "successor_codebook", kind = "in", elem = "bf16", len = "vocab_size * selector_rank" },
  { name = "anchor", kind = "indices", len = "1", below = "vocab_size" },
  { name = "tokens", kind = "out", elem = "u32", len = "count + 1" },
  { name = "confidences", kind = "out", elem = "f32", len = "count" },
  # [row][ceil(vocab / 2048)][16]
  { name = "partial_scores", kind = "out", elem = "f32", len = "count * ((vocab_size + 2047) / 2048) * 16" },
  { name = "partial_ids", kind = "out", elem = "u32", len = "count * ((vocab_size + 2047) / 2048) * 16" },
  { name = "uniforms", kind = "in", elem = "f32", len = "count" },
  { name = "candidate_ids", kind = "out", elem = "u32", len = "count * selector_top_k" },
  { name = "candidate_probabilities", kind = "out", elem = "f32", len = "count * selector_top_k" },
  { name = "count", kind = "scalar", type = "u32" },
  { name = "temperature", kind = "scalar", type = "f32" },
  { name = "vocab_size", kind = "scalar", type = "u32" },
  { name = "selector_rank", kind = "scalar", type = "u32" },
  { name = "selector_top_k", kind = "scalar", type = "u32" },
  { name = "repeat_penalty", kind = "scalar", type = "f32" },
  { name = "frequency_penalty", kind = "scalar", type = "f32" },
  { name = "presence_penalty", kind = "scalar", type = "f32" },
  { name = "repeat_last_n", kind = "scalar", type = "u32" },
  # sampling::TokenPenalty sorted by token, three words each: token,
  # generated count, repeated (only the counts are read).
  { name = "penalties", kind = "in", elem = "u32", len = "penalty_count * 3", optional = true },
  { name = "penalty_count", kind = "scalar", type = "u32" },
  # The request's repetition window, oldest first.
  { name = "history", kind = "in", elem = "u32", len = "history_count", optional = true },
  { name = "history_count", kind = "scalar", type = "u32" },
]
probes = [
  { count = 7, temperature = 0.8, vocab_size = 248320, selector_rank = 256, selector_top_k = 16, repeat_penalty = 1.0, frequency_penalty = 0.0, presence_penalty = 0.0, repeat_last_n = 0, penalty_count = 0, history_count = 0 },
  { count = 1, temperature = 1.0, vocab_size = 100, selector_rank = 8, selector_top_k = 4, repeat_penalty = 1.0, frequency_penalty = 0.0, presence_penalty = 0.0, repeat_last_n = 0, penalty_count = 0, history_count = 0 },
  { count = 7, temperature = 0.7, vocab_size = 248320, selector_rank = 256, selector_top_k = 16, repeat_penalty = 1.1, frequency_penalty = 0.2, presence_penalty = 1.5, repeat_last_n = 64, penalty_count = 5, history_count = 64, with = ["penalties", "history"] },
]

