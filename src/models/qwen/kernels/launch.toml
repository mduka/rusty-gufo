[[launcher]]
name = "batched_ssm_conv_recurrence_row_split"
cpp = "LaunchBatchedSSMConvRecurrenceRowSplitFlat"
returns = "void"
doc = "Causal conv and gated DeltaNet recurrence of `batch_size` rows for layer `layer_idx` with the row-split kernels (128 x 128 state per head, FP32 state); the post-norm/gate epilogue writes the tiled Q8_1 activation, FP16 values, or `out_buf` in place."
requires = [
  "key_dim == 128",
  "val_dim == 128",
  "batch_size > 0",
  "num_key_heads > 0",
  "num_heads > 0",
  "qkv_size % 4 == 0",
  # The last row's q, k and v lie inside its qkv row.
  "2 * num_key_heads * key_dim + num_heads * val_dim <= qkv_size",
]
params = [
  { name = "qkv_in", kind = "in", elem = "f32", len = "batch_size * qkv_size" },
  { name = "conv_weights", kind = "in", elem = "f32", len = "qkv_size * 4" },
  # [layer][qkv_size][4]
  { name = "conv_state", kind = "inout", elem = "f32", len = "(layer_idx + 1) * qkv_size * 4" },
  # The state the pass reads when it forks into `conv_state` (QwenRecurrentStateIo).
  { name = "conv_in", kind = "in", elem = "f32", optional = true, len = "(layer_idx + 1) * qkv_size * 4" },
  { name = "conv_out", kind = "out", elem = "f32", len = "batch_size * qkv_size" },
  # FP32 [layer][heads][val_dim][key_dim], passed as bytes (`void*`).
  { name = "deltanet_state", kind = "inout", elem = "bytes", len = "(layer_idx + 1) * num_heads * key_dim * val_dim * 4" },
  { name = "deltanet_in", kind = "in", elem = "bytes", optional = true, len = "(layer_idx + 1) * num_heads * key_dim * val_dim * 4" },
  { name = "alpha_buf", kind = "in", elem = "f32", len = "batch_size * num_heads" },
  { name = "beta_buf", kind = "in", elem = "f32", len = "batch_size * num_heads" },
  { name = "ssm_a", kind = "in", elem = "f32", len = "num_heads" },
  { name = "ssm_dt", kind = "in", elem = "f32", len = "num_heads" },
  { name = "ssm_norm", kind = "in", elem = "f32", len = "val_dim" },
  { name = "gate", kind = "in", elem = "f32", len = "batch_size * num_heads * val_dim" },
  { name = "out_buf", kind = "out", elem = "f32", len = "batch_size * num_heads * val_dim" },
  # Tiled Q8_1 activation of the gated output (ignored when fp16_out is set).
  { name = "q8_out", kind = "out", elem = "bytes", optional = true, len = "((batch_size + 15) / 16) * (num_heads * val_dim / 32) * 640" },
  { name = "kq_scales", kind = "out", elem = "f32", len = "batch_size * num_key_heads * 3" },
  { name = "alpha_beta", kind = "out", elem = "f32", len = "batch_size * num_heads * 2" },
  { name = "layer_idx", kind = "scalar", type = "u32" },
  { name = "batch_size", kind = "scalar", type = "usize" },
  { name = "qkv_size", kind = "scalar", type = "usize" },
  { name = "num_key_heads", kind = "scalar", type = "u32" },
  { name = "num_heads", kind = "scalar", type = "u32" },
  { name = "key_dim", kind = "scalar", type = "u32" },
  { name = "val_dim", kind = "scalar", type = "u32" },
  { name = "stream", kind = "stream" },
  { name = "state_storage", kind = "const", cpp_type = "gufo::hip::QwenRecurrentStateStorage", value = "gufo::hip::QwenRecurrentStateStorage::kFp32" },
  # IEEE half gated output for the FP16 prefill.
  { name = "fp16_out", kind = "out", elem = "f16", optional = true, len = "batch_size * num_heads * val_dim" },
]
probes = [
  { layer_idx = 1, batch_size = 20, qkv_size = 10240, num_key_heads = 16, num_heads = 48, key_dim = 128, val_dim = 128, with = ["q8_out"] },
  { layer_idx = 0, batch_size = 2049, qkv_size = 10240, num_key_heads = 16, num_heads = 48, key_dim = 128, val_dim = 128, with = ["fp16_out"] },
  { layer_idx = 0, batch_size = 3, qkv_size = 1024, num_key_heads = 2, num_heads = 4, key_dim = 128, val_dim = 128 },
]

