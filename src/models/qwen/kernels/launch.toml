# Kernel contract for the Qwen3.8 27B text engine (docs/RUST.md).
# Extents are element counts; the C++ launcher takes `hipStream_t` last.
# Trusted base: a wrong extent compiles and lets a kernel overrun its buffer.
# Review changes like unsafe code; every launcher needs probes (tests/extents.rs).

[library]
name = "qwen"
root = "../../../.."
namespace = "gufo::hip"
format_type = "gufo::core::GgmlType"
headers = [
  "src/models/qwen/hip/ops.hpp",
  "src/models/qwen/hip/ops/prefill_fp16.hpp",
  "src/models/qwen/hip/kernels/dflash_kernels.hpp",
  "src/models/qwen/kernels/adapters.hpp",
  "src/models/qwen/vision/kernels.hpp",
]

