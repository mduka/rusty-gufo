# --- Decode (one token) -------------------------------------------------------

[[launcher]]
name = "embedding_lookup"
cpp = "LaunchEmbeddingLookup"
returns = "void"
doc = "Embedding row of the token in `token_id` (device memory), decoded to f32."
params = [
  { name = "table", kind = "quant", rows = "rows", cols = "hidden_size", formats = ["F32", "BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "Q8_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "table_type", kind = "format", of = "table" },
  { name = "token_id", kind = "indices", len = "1", below = "rows" },
  { name = "out_hidden", kind = "out", elem = "f32", len = "hidden_size" },
  { name = "hidden_size", kind = "scalar", type = "usize" },
  { name = "rows", kind = "scalar", type = "usize", contract_only = true },
]
probes = [
  { table = "Q4_K", hidden_size = 5120, rows = 3 },
  { table = "F32", hidden_size = 300, rows = 1 },
]

[[launcher]]
name = "embedding_lookup_token"
cpp = "LaunchEmbeddingLookup"
returns = "void"
doc = "Embedding row of the host token `token_id`, decoded to f32 (the Qwen3-TTS code predictor)."
params = [
  { name = "table", kind = "quant", rows = "rows", cols = "hidden_size", formats = ["F32", "BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "Q8_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "table_type", kind = "format", of = "table" },
  { name = "token_id", kind = "scalar", type = "u32" },
  { name = "out_hidden", kind = "out", elem = "f32", len = "hidden_size" },
  { name = "hidden_size", kind = "scalar", type = "usize" },
  { name = "rows", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["token_id < rows"]
probes = [
  { table = "BF16", token_id = 2, hidden_size = 2048, rows = 3 },
  { table = "Q4_K", token_id = 0, hidden_size = 256, rows = 1 },
]

[[launcher]]
name = "float_to_bf16"
cpp = "LaunchFloatToBfloat16"
returns = "void"
doc = "Rounds f32 values to BF16 (round to nearest even)."
params = [
  { name = "input", kind = "in", elem = "f32", len = "num_elements" },
  { name = "output", kind = "out", elem = "bf16", len = "num_elements" },
  { name = "num_elements", kind = "scalar", type = "usize" },
]
probes = [{ num_elements = 4096 }, { num_elements = 1 }]

[[launcher]]
name = "rms_norm"
cpp = "LaunchRMSNorm"
returns = "void"
doc = "RMSNorm of one row (the 5120-wide Qwen27B row stays in registers)."
params = [
  { name = "x", kind = "in", elem = "f32", len = "dim" },
  { name = "weight", kind = "in", elem = "f32", len = "dim" },
  { name = "out", kind = "out", elem = "f32", len = "dim" },
  { name = "dim", kind = "scalar", type = "usize" },
  { name = "eps", kind = "scalar", type = "f32" },
]
probes = [
  { dim = 5120, eps = 1e-6 },
  { dim = 17, eps = 1e-6 },
]

[[launcher]]
name = "residual_add"
cpp = "LaunchResidualAdd"
returns = "void"
doc = "`hidden += update`."
params = [
  { name = "a", kind = "alias", of = "hidden", elem = "f32", read_only = true },
  { name = "update", kind = "in", elem = "f32", len = "dim" },
  { name = "hidden", kind = "inout", elem = "f32", len = "dim" },
  { name = "dim", kind = "scalar", type = "usize" },
]
probes = [
  { dim = 5120 },
  { dim = 1 },
]

[[launcher]]
name = "unpack_qg"
cpp = "LaunchUnpackQG"
returns = "void"
doc = "Splits interleaved [Q_h, Gate_h] head pairs into Q and Gate."
params = [
  { name = "qg_interleaved", kind = "in", elem = "f32", len = "2 * num_heads * head_dim" },
  { name = "q_out", kind = "out", elem = "f32", len = "num_heads * head_dim" },
  { name = "gate_out", kind = "out", elem = "f32", len = "num_heads * head_dim" },
  { name = "num_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
]
probes = [
  { num_heads = 24, head_dim = 256 },
  { num_heads = 1, head_dim = 3 },
]

[[launcher]]
name = "fused_qkv_projections"
cpp = "LaunchFusedQKVProjections"
returns = "void"
doc = "Q (with its interleaved gate), K and V projections of one row in one dispatch."
params = [
  { name = "q_w", kind = "quant", rows = "q_dim", cols = "hidden_size", formats = ["BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "Q8_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "q_type", kind = "format", of = "q_w" },
  { name = "k_w", kind = "quant", rows = "kv_dim", cols = "hidden_size", formats = ["BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "Q8_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "k_type", kind = "format", of = "k_w" },
  { name = "v_w", kind = "quant", rows = "kv_dim", cols = "hidden_size", formats = ["BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "Q8_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "v_type", kind = "format", of = "v_w" },
  { name = "x", kind = "in", elem = "f32", len = "hidden_size" },
  { name = "q_out", kind = "out", elem = "f32", len = "q_dim" },
  { name = "k_out", kind = "out", elem = "f32", len = "kv_dim" },
  { name = "v_out", kind = "out", elem = "f32", len = "kv_dim" },
  { name = "q_dim", kind = "scalar", type = "usize" },
  { name = "kv_dim", kind = "scalar", type = "usize" },
  { name = "hidden_size", kind = "scalar", type = "usize" },
]
probes = [
  { q_w = "Q5_K", k_w = "Q6_K", v_w = "Q8_0", q_dim = 12288, kv_dim = 1024, hidden_size = 5120 },
  { q_w = "IQ4_XS", k_w = "Q4_K", v_w = "Q5_K", q_dim = 8, kv_dim = 4, hidden_size = 256 },
  { q_w = "BF16", k_w = "BF16", v_w = "BF16", q_dim = 1024, kv_dim = 256, hidden_size = 1024 },
]

[[launcher]]
name = "fused_qk_norm_rope_kv_write"
cpp = "LaunchFusedQKNormRoPEKvWrite"
returns = "void"
doc = "Per-head Q/K RMSNorm and RoPE in place, and the K/V write into the FP16 cache at position `pos`."
requires = ["head_dim <= 256", "rotary_dim <= head_dim", "rotary_dim % 2 == 0"]
params = [
  { name = "q_in", kind = "alias", of = "q", elem = "f32", read_only = true },
  { name = "k_in", kind = "alias", of = "k", elem = "f32", read_only = true },
  { name = "v", kind = "in", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "q_weight", kind = "in", elem = "f32", len = "head_dim" },
  { name = "k_weight", kind = "in", elem = "f32", len = "head_dim" },
  { name = "q", kind = "inout", elem = "f32", len = "num_heads * head_dim" },
  { name = "k", kind = "inout", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "k_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "v_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  # FP16 caches [layer][max_context][num_kv_heads * head_dim]; this launch
  # writes layer `layer_idx` only.
  { name = "k_cache_f16", kind = "inout", elem = "f16", len = "(layer_idx + 1) * max_context * num_kv_heads * head_dim" },
  { name = "v_cache_f16", kind = "inout", elem = "f16", len = "(layer_idx + 1) * max_context * num_kv_heads * head_dim" },
  { name = "layer_idx", kind = "scalar", type = "u32" },
  { name = "pos", kind = "indices", len = "1", below = "max_context" },
  { name = "max_context", kind = "scalar", type = "u32" },
  { name = "num_heads", kind = "scalar", type = "u32" },
  { name = "num_kv_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "rotary_dim", kind = "scalar", type = "u32" },
  { name = "rope_theta", kind = "scalar", type = "f32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "stream", kind = "stream" },
  { name = "rope", kind = "table", elem = "i32", width = 3, cpp_type = "const gufo::models::qwen::vision::DeviceRope*", optional = true },
]
probes = [
  { layer_idx = 2, max_context = 8, num_heads = 24, num_kv_heads = 4, head_dim = 256, rotary_dim = 64, rope_theta = 1e7, eps = 1e-6 },
  { layer_idx = 0, max_context = 1, num_heads = 2, num_kv_heads = 1, head_dim = 16, rotary_dim = 16, rope_theta = 1e4, eps = 1e-6 },
]

[[launcher]]
name = "attention_graph"
cpp = "LaunchAttention"
returns = "void"
doc = "Decode attention with gate over the FP16 cache rows 0..=pos, position read from device memory (graph form, below the split-K threshold)."
params = [
  { name = "q", kind = "in", elem = "f32", len = "num_heads * head_dim" },
  { name = "k", kind = "in", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "v", kind = "in", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "gate", kind = "in", elem = "f32", len = "num_heads * head_dim" },
  { name = "k_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "v_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "k_cache_f16", kind = "inout", elem = "f16", len = "(layer_idx + 1) * max_context * num_kv_heads * head_dim" },
  { name = "v_cache_f16", kind = "inout", elem = "f16", len = "(layer_idx + 1) * max_context * num_kv_heads * head_dim" },
  { name = "out_context", kind = "out", elem = "f32", len = "num_heads * head_dim" },
  { name = "layer_idx", kind = "scalar", type = "u32" },
  { name = "pos", kind = "indices", len = "1", below = "max_context" },
  { name = "max_context", kind = "scalar", type = "u32" },
  { name = "num_heads", kind = "scalar", type = "u32" },
  { name = "num_kv_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "stream", kind = "stream" },
  # The fused QK-norm kernel already wrote the cache.
  { name = "skip_kv_write", kind = "const", cpp_type = "bool", value = "true" },
]
probes = [
  { layer_idx = 1, max_context = 8, num_heads = 24, num_kv_heads = 4, head_dim = 256 },
]

[[launcher]]
name = "gpu_sampling"
cpp = "LaunchGPUSamplingFlat"
returns = "void"
doc = "One token from a logits row under the sampling policy (penalties, temperature, top-k/p, min-p) with the draw `uniform`; argmax without temperature."
requires = ["vocab_size > 0"]
params = [
  { name = "logits", kind = "in", elem = "f32", len = "vocab_size" },
  { name = "out_token", kind = "out", elem = "u32", len = "1" },
  { name = "vocab_size", kind = "scalar", type = "usize" },
  { name = "temperature", kind = "scalar", type = "f32" },
  { name = "top_k", kind = "scalar", type = "i32" },
  { name = "top_p", kind = "scalar", type = "f32" },
  { name = "min_p", kind = "scalar", type = "f32" },
  { name = "min_keep", kind = "scalar", type = "usize" },
  { name = "repeat_penalty", kind = "scalar", type = "f32" },
  { name = "frequency_penalty", kind = "scalar", type = "f32" },
  { name = "presence_penalty", kind = "scalar", type = "f32" },
  { name = "uniform", kind = "scalar", type = "f64" },
  # sampling::TokenPenalty as three words: token, generated count, repeated.
  { name = "penalties", kind = "in", elem = "u32", len = "penalty_count * 3" },
  { name = "penalty_count", kind = "scalar", type = "usize" },
  { name = "adjusted_logits", kind = "out", elem = "f32", len = "vocab_size" },
  { name = "sorted_logits", kind = "out", elem = "f32", len = "vocab_size" },
  { name = "token_ids", kind = "out", elem = "u32", len = "vocab_size" },
  { name = "sorted_token_ids", kind = "out", elem = "u32", len = "vocab_size" },
  { name = "sort_storage", kind = "out", elem = "bytes", len = "sort_storage_bytes" },
  { name = "sort_storage_bytes", kind = "scalar", type = "usize" },
]
probes = [
  { vocab_size = 248320, temperature = 0.8, top_k = 40, top_p = 0.95, min_p = 0.05, min_keep = 1, repeat_penalty = 1.1, frequency_penalty = 0.0, presence_penalty = 0.0, uniform = 0.5, penalty_count = 3, sort_storage_bytes = 16777216 },
  { vocab_size = 7, temperature = 0.0, top_k = 0, top_p = 1.0, min_p = 0.0, min_keep = 0, repeat_penalty = 1.0, frequency_penalty = 0.0, presence_penalty = 0.0, uniform = 0.0, penalty_count = 0, sort_storage_bytes = 4096 },
]

[[launcher]]
name = "packed_quant_swiglu_fp32"
cpp = "TryLaunchPackedQuantSwiGLUFp32"
returns = "supported"
doc = "`silu(x gate^T) * (x up^T)` over adjacent gate and up rows read as one matrix, with the exact small-batch arithmetic; only for the 27B FFN at 14 rows or 16 to 64 rows in steps of 16."
params = [
  { name = "gate_up_type", kind = "format", of = "gate_up" },
  { name = "gate_up", kind = "quant", rows = "2 * intermediate_size", cols = "hidden_size", formats = ["Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "input", kind = "in", elem = "f32", len = "batch_size * hidden_size" },
  { name = "output", kind = "out", elem = "f32", len = "batch_size * intermediate_size" },
  { name = "batch_size", kind = "scalar", type = "usize" },
  { name = "intermediate_size", kind = "scalar", type = "usize" },
  { name = "hidden_size", kind = "scalar", type = "usize" },
]
probes = [
  { gate_up = "Q4_K", batch_size = 16, intermediate_size = 17408, hidden_size = 5120 },
  { gate_up = "Q4_K", batch_size = 14, intermediate_size = 17408, hidden_size = 5120 },
  { gate_up = "Q5_K", batch_size = 64, intermediate_size = 17408, hidden_size = 5120 },
  { gate_up = "IQ4_XS", batch_size = 32, intermediate_size = 17408, hidden_size = 5120 },
]

[[launcher]]
name = "gpu_speculative_sampling"
cpp = "LaunchGPUSpeculativeSamplingFlat"
returns = "void"
doc = "Lossless speculative sampling of one verification row: accepts `draft_token` with probability min(1, p/q) under the target policy, else draws from the residual of the draft candidates; `out_accepted` is 1 on acceptance."
requires = ["vocab_size > 0", "candidate_count > 0"]
params = [
  { name = "logits", kind = "in", elem = "f32", len = "vocab_size" },
  { name = "out_token", kind = "out", elem = "u32", len = "1" },
  { name = "out_accepted", kind = "out", elem = "u32", len = "1" },
  { name = "vocab_size", kind = "scalar", type = "usize" },
  { name = "temperature", kind = "scalar", type = "f32" },
  { name = "top_k", kind = "scalar", type = "i32" },
  { name = "top_p", kind = "scalar", type = "f32" },
  { name = "min_p", kind = "scalar", type = "f32" },
  { name = "min_keep", kind = "scalar", type = "usize" },
  { name = "repeat_penalty", kind = "scalar", type = "f32" },
  { name = "frequency_penalty", kind = "scalar", type = "f32" },
  { name = "presence_penalty", kind = "scalar", type = "f32" },
  { name = "draft_token", kind = "scalar", type = "u32" },
  { name = "draft_token_probability", kind = "scalar", type = "f32" },
  { name = "candidate_ids", kind = "in", elem = "u32", len = "candidate_count" },
  { name = "candidate_probabilities", kind = "in", elem = "f32", len = "candidate_count" },
  { name = "candidate_count", kind = "scalar", type = "usize" },
  { name = "acceptance_uniform", kind = "scalar", type = "f64" },
  { name = "residual_uniform", kind = "scalar", type = "f64" },
  # sampling::TokenPenalty as three words: token, generated count, repeated.
  { name = "penalties", kind = "in", elem = "u32", len = "penalty_count * 3" },
  { name = "penalty_count", kind = "scalar", type = "usize" },
  { name = "adjusted_logits", kind = "out", elem = "f32", len = "vocab_size" },
  { name = "sorted_logits", kind = "out", elem = "f32", len = "vocab_size" },
  { name = "token_ids", kind = "out", elem = "u32", len = "vocab_size" },
  { name = "sorted_token_ids", kind = "out", elem = "u32", len = "vocab_size" },
  { name = "sort_storage", kind = "out", elem = "bytes", len = "sort_storage_bytes" },
  { name = "sort_storage_bytes", kind = "scalar", type = "usize" },
]
probes = [
  { vocab_size = 248320, temperature = 0.8, top_k = 40, top_p = 0.9, min_p = 0.05, min_keep = 2, repeat_penalty = 1.1, frequency_penalty = 0.2, presence_penalty = 0.1, draft_token = 7, draft_token_probability = 0.5, candidate_count = 8, acceptance_uniform = 0.25, residual_uniform = 0.5, penalty_count = 3, sort_storage_bytes = 16777216 },
  { vocab_size = 248320, temperature = 0.7, top_k = 0, top_p = 1.0, min_p = 0.0, min_keep = 0, repeat_penalty = 1.0, frequency_penalty = 0.0, presence_penalty = 0.0, draft_token = 3, draft_token_probability = 0.9, candidate_count = 4, acceptance_uniform = 0.95, residual_uniform = 0.1, penalty_count = 0, sort_storage_bytes = 16777216 },
  { vocab_size = 9, temperature = 1.0, top_k = 0, top_p = 1.0, min_p = 0.0, min_keep = 0, repeat_penalty = 1.0, frequency_penalty = 0.0, presence_penalty = 0.0, draft_token = 2, draft_token_probability = 0.3, candidate_count = 2, acceptance_uniform = 0.5, residual_uniform = 0.5, penalty_count = 1, sort_storage_bytes = 4096 },
]

[[launcher]]
name = "sort_logits"
cpp = "LaunchGPUSortLogitsFlat"
returns = "void"
