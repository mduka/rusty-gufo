cpp = "LaunchDFlashSelectorVocabFlat"
returns = "void"
doc = "dflash_selector (`temperature` 0) or dflash_selector_sampled over the draft vocabulary: the logits rows hold the head's first `prefix` IDs, `table_logits` the scores of the request's table (`table_ids`, -1 empty); proposals and candidates are full vocabulary IDs. Candidates are optional (both or neither). Empty slots must score -inf, as dflash_draft_table_logits writes them: a finite score would make -1 a candidate and the selector read its codebook row out of bounds (a read, no write leaves the buffers)."
