# --- 8-bit KV cache (--kv-cache q8_0; vendor/family/kernels/kv_q8.hpp) --------
# Each (layer, position, KV head) row holds 256 int8 values and 8 FP16
# scales: 272 bytes, token-major like the FP16 cache, so a plane is
# [layer][max_context][kv heads][272] bytes. Only 256-wide heads.

[[launcher]]
name = "attention_write_q8"
cpp = "LaunchAttention"
returns = "void"
doc = "Decode attention with gate for one row at a scalar position over the 8-bit cache: writes its K/V row first, then attends rows 0..=pos on the WMMA route (eight query heads per KV head, else an error)."
requires = ["pos < max_context", "head_dim == 256"]
params = [
  { name = "q", kind = "in", elem = "f32", len = "num_heads * head_dim" },
  { name = "k", kind = "in", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "v", kind = "in", elem = "f32", len = "num_kv_heads * head_dim" },
  { name = "gate", kind = "in", elem = "f32", len = "num_heads * head_dim" },
  { name = "k_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "v_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "k_cache_q8", kind = "inout", elem = "bytes", len = "(layer_idx + 1) * max_context * num_kv_heads * 272" },
  { name = "v_cache_q8", kind = "inout", elem = "bytes", len = "(layer_idx + 1) * max_context * num_kv_heads * 272" },
  { name = "out_context", kind = "out", elem = "f32", len = "num_heads * head_dim" },
  { name = "layer_idx", kind = "scalar", type = "u32" },
  { name = "pos", kind = "scalar", type = "u32" },
  { name = "max_context", kind = "scalar", type = "u32" },
  { name = "num_heads", kind = "scalar", type = "u32" },
  { name = "num_kv_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "stream", kind = "stream" },
  # DecodeAttentionScratchElements: heads x 32 splits x (head_dim + 2).
  { name = "split_k_scratch", kind = "out", elem = "f32", len = "num_heads * 32 * (head_dim + 2)" },
  { name = "skip_kv_write", kind = "const", cpp_type = "bool", value = "false" },
  { name = "kv_q8", kind = "const", cpp_type = "bool", value = "true" },
]
probes = [
  { layer_idx = 1, pos = 700, max_context = 1024, num_heads = 16, num_kv_heads = 2, head_dim = 256 },
  { layer_idx = 0, pos = 0, max_context = 4, num_heads = 16, num_kv_heads = 2, head_dim = 256 },
]

