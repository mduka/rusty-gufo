[[launcher]]
name = "routed_compact"
cpp = "::gufo::models::qwen35moe::models::qwen38_flash_next::rocm::RoutedCompact"
returns = "void"
doc = "Sorts the (token, slot) assignments by expert into 16-row padded buckets: pad_bounds (n_experts + 1 entries) and the compact rows' token and slot (-1 for padding)."
params = [
  { name = "ids", kind = "indices", signed = true, padded = true, len = "n_tokens * k", below = "n_experts" },
  # The scatter trusts that counts[e] is exactly the number of IDs equal to e,
  # which the derivation guarantees; the bound only names the buffer's
  # capacity (`slot_bound` assignments).
  { name = "counts", kind = "indices", len = "n_experts", below = "slot_bound + 1", derived_from = "ids", tag = "n_experts" },
  { name = "pad_bounds", kind = "indices_out", signed = true, len = "n_experts + 1", below = "n_tokens * k + n_experts * 15 + 1" },
  { name = "cursors", kind = "out", elem = "i32", len = "n_experts" },
  { name = "rows_token", kind = "indices_out", signed = true, padded = true, len = "n_tokens * k + n_experts * 15", below = "n_tokens" },
  { name = "rows_slot", kind = "indices_out", signed = true, padded = true, len = "n_tokens * k + n_experts * 15", below = "n_tokens * k" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "k", kind = "scalar", type = "u32" },
  { name = "n_experts", kind = "scalar", type = "u32" },
  { name = "slot_bound", kind = "scalar", type = "u32", contract_only = true },
]
requires = ["n_experts >= 1", "n_experts <= 1024", "n_tokens * k <= slot_bound"]
# Uniform zero counts keep every scatter inside the first rows.
probes = [{ n_tokens = 130, k = 8, n_experts = 256, slot_bound = 2000, counts = 0 }]

