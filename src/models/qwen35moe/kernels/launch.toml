[[launcher]]
name = "batched_attention"
cpp = "LaunchBatchedAttention"
returns = "void"
doc = "Causal attention with gate of `batch_size` rows over FP16 cache rows `0..start_pos + batch_size`, one block per query row and head (the C++ prefill fallback for head shapes the WMMA attention declines). The scores of a row live in LDS beside a 1 KiB reduction buffer, so at most 16128 positions are visible in the 64 KiB of a workgroup; `skip_kv_write` when the fused QK-norm kernel wrote this chunk's K and V."
requires = ["start_pos + batch_size <= max_context", "start_pos + batch_size <= 16128", "num_kv_heads > 0", "num_heads % num_kv_heads == 0"]
params = [
  { name = "q", kind = "in", elem = "f32", len = "batch_size * num_heads * head_dim" },
  { name = "k", kind = "in", elem = "f32", len = "batch_size * num_kv_heads * head_dim" },
  { name = "v", kind = "in", elem = "f32", len = "batch_size * num_kv_heads * head_dim" },
  { name = "gate", kind = "in", elem = "f32", len = "batch_size * num_heads * head_dim" },
  { name = "k_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "v_cache", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "k_cache_f16", kind = "inout", elem = "f16", len = "(layer_idx * max_context + start_pos + batch_size) * num_kv_heads * head_dim" },
