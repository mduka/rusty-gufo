  { name = "workspace", kind = "scalar", type = "u32", contract_only = true },
]
# MtpCandidateWorkspaceSize: max(tiles of 1024, 2) * 64 IDs per buffer.
requires = ["vocab >= 1", "workspace >= (vocab + 1023) / 1024 * 64", "workspace >= 128"]
probes = [{ vocab = 248320, workspace = 15552 }, { vocab = 50, workspace = 128 }]

# --- Quantized GEMM tier (vendor/fnext/kernels/rocm/mmq/qfn_mmq.h) -------------
# Scratch is the caller's, per call: the tier's stack allocations, each
# rounded up to 256 bytes, inside a 256-byte aligned buffer. The tier reads
# whole 256-value k-iterations past the last row of a weight matrix whose rows
# are only a multiple of 32 values: weights carry 4096 zero bytes after it
# (`tail`).

[[launcher]]
name = "mmq_prepare"
cpp = "MmqPrepare"
returns = "supported"
doc = "Initialises the tier (device context and pool) once per process, as the C++ model loader does before serving."
params = []
probes = [{}]

[[launcher]]
name = "mmq_release_stream"
cpp = "MmqReleaseStream"
returns = "void"
doc = "Frees the tier's scratch arena of the stream after its queued work; the stream is about to be destroyed."
params = []
probes = [{}]

[[launcher]]
name = "mmq_moe_vec"
cpp = "MmqMoeVec"
returns = "supported"
doc = "Routed vector projection out[t][s] = W[ids[t][s]] . x[t] (Q4_K, Q5_K, Q6_K, Q5_1, Q8_0); padded slots write zeros. With n_used 1, `x` holds one row per slot: the down projection."
params = [
  { name = "weight_type", kind = "format", of = "w" },
  { name = "w", kind = "quant", rows = "n_experts * m", cols = "k", formats = ["Q4_K", "Q5_K", "Q6_K", "Q5_1", "Q8_0"], tail = "4096" },
  { name = "x", kind = "in", elem = "f32", len = "n_tokens * k" },
  { name = "ids", kind = "indices", signed = true, padded = true, len = "n_tokens * n_used", below = "n_experts" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * n_used * m" },
  { name = "m", kind = "scalar", type = "u32" },
  { name = "k", kind = "scalar", type = "u32" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "n_experts", kind = "scalar", type = "u32" },
  { name = "n_used", kind = "scalar", type = "u32" },
  { name = "scratch", kind = "out", elem = "bytes", len = "scratch_bytes" },
  { name = "scratch_bytes", kind = "scalar", type = "usize" },
]
# Q8_1 rows plus the expert-ordered slot maps (Q5_1/Q8_0 with k 640).
requires = ["scratch_bytes >= (n_tokens * ((k + 511) / 512 * 512) / 32 * 36 + 8 * n_tokens + 255) / 256 * 256"]
probes = [
  { w = "Q5_K", m = 2048, k = 512, n_tokens = 8, n_experts = 256, n_used = 1, scratch_bytes = 65536 },
  { w = "Q6_K", m = 2048, k = 512, n_tokens = 1, n_experts = 4, n_used = 1, scratch_bytes = 4096 },
  { w = "Q8_0", m = 2560, k = 640, n_tokens = 20, n_experts = 3, n_used = 1, scratch_bytes = 65536 },
]

[[launcher]]
name = "mmq_moe_gated_vec"
cpp = "MmqMoeGatedVec"
returns = "supported"
doc = "Routed gate/up projection with SwiGLU, out[t][s] = silu(gate . x[t]) * (up . x[t]), for 1-8 tokens (Q4_K: up to 64 rows); padded slots write zeros."
params = [
  { name = "weight_type", kind = "format", of = "gate" },
  { name = "gate", kind = "quant", rows = "n_experts * m", cols = "k", formats = ["Q4_K", "Q5_K", "Q8_0"], tail = "4096" },
  { name = "up", kind = "quant", rows = "n_experts * m", cols = "k", formats = ["Q4_K", "Q5_K", "Q8_0"], same_format = "gate", tail = "4096" },
  { name = "x", kind = "in", elem = "f32", len = "n_tokens * k" },
  { name = "ids", kind = "indices", signed = true, padded = true, len = "n_tokens * n_used", below = "n_experts" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * n_used * m" },
  { name = "m", kind = "scalar", type = "u32" },
  { name = "k", kind = "scalar", type = "u32" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "n_experts", kind = "scalar", type = "u32" },
  { name = "n_used", kind = "scalar", type = "u32" },
  # Q8_1 rows plus the larger of both expert group layouts.
  { name = "scratch", kind = "out", elem = "bytes", len = "scratch_bytes" },
  { name = "scratch_bytes", kind = "scalar", type = "usize" },
]
requires = ["scratch_bytes >= (n_tokens * ((k + 511) / 512 * 512) / 32 * 36 + 4 + n_tokens * n_used * 72 + n_tokens * n_used * (n_tokens + 1) * 4 + 255) / 256 * 256"]
probes = [
  { gate = "Q4_K", up = "Q4_K", m = 512, k = 2048, n_tokens = 1, n_experts = 256, n_used = 8, scratch_bytes = 65536 },
  { gate = "Q4_K", up = "Q4_K", m = 512, k = 2048, n_tokens = 40, n_experts = 16, n_used = 8, scratch_bytes = 262144 },
  { gate = "Q8_0", up = "Q8_0", m = 640, k = 2560, n_tokens = 5, n_experts = 3, n_used = 2, scratch_bytes = 65536 },
]

