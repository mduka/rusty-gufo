probes = [{ count = 160, n_experts = 256, ids = 4294967295 }, { count = 1, n_experts = 1 }]

[[launcher]]
name = "moe_slot_gemv"
cpp = "LaunchMoeSlotGemv"
returns = "void"
doc = "Routed per-slot GEMV: `out[s] = W[ids[s]] x[s / token_divisor]` (1 for the down projection's per-slot rows, n_used for gate/up sharing the token's row), for expert formats the vendored tier does not cover."
requires = ["slots >= 1", "token_divisor >= 1", "input_rows * token_divisor >= slots"]
params = [
  { name = "w", kind = "quant", rows = "n_experts * m", cols = "k", formats = ["F32", "BF16", "Q8_0", "Q3_K", "Q4_K", "Q5_K", "Q6_K", "IQ4_NL", "IQ4_XS", "IQ3_S"] },
  { name = "w_type", kind = "format", of = "w" },
  { name = "x", kind = "in", elem = "f32", len = "input_rows * k" },
  { name = "ids", kind = "indices", signed = true, len = "slots", below = "n_experts" },
  { name = "out", kind = "out", elem = "f32", len = "slots * m" },
  { name = "m", kind = "scalar", type = "usize" },
  { name = "k", kind = "scalar", type = "usize" },
  { name = "slots", kind = "scalar", type = "u32" },
  { name = "token_divisor", kind = "scalar", type = "u32" },
  { name = "n_experts", kind = "scalar", type = "u32", contract_only = true },
  # Input rows: slot s reads row s / token_divisor.
  { name = "input_rows", kind = "scalar", type = "u32", contract_only = true },
]
probes = [
  { w = "BF16", m = 2048, k = 512, slots = 16, token_divisor = 1, n_experts = 8, input_rows = 16 },
  { w = "Q6_K", m = 300, k = 512, slots = 9, token_divisor = 3, n_experts = 4, input_rows = 3 },
]

