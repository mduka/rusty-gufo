# --- Routed experts (vendor/family/kernels/moe.hip, routed_f16.hip) -----------
# Expert weights are stacked [n_experts][m][k]. Router IDs are int32 [token]
# [slot]; a router row whose logits are not finite routes every slot to -1
# (padding). The vendored tier and the routed F16 path skip padding; the
# per-slot GEMVs and the grouped BF16 GEMM index weights with every ID and
# take moe_ids_unpad's copy.

