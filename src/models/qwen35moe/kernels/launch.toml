cpp = "LaunchMoeEpilogue"
returns = "void"
doc = "`out[t] = sum_s weights[t][s] * expert_out[t * n_used + s] + sigmoid(shared_gate[t]) * shared_out[t]`."
requires = ["dim % 4 == 0"]
params = [
  { name = "expert_out", kind = "in", elem = "f32", len = "n_tokens * n_used * dim" },
  { name = "weights", kind = "in", elem = "f32", len = "n_tokens * n_used" },
  { name = "shared_out", kind = "in", elem = "f32", len = "n_tokens * dim" },
  { name = "shared_gate", kind = "in", elem = "f32", len = "n_tokens" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * dim" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "n_used", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
]
probes = [{ n_tokens = 17, n_used = 8, dim = 2048 }, { n_tokens = 1, n_used = 1, dim = 4 }]

[[launcher]]
name = "moe_ids_unpad"
