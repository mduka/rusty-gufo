  { name = "destination", kind = "out", elem = "bytes", len = "count * row_bytes" },
  { name = "count", kind = "scalar", type = "u32" },
  { name = "source_rows", kind = "scalar", type = "usize", contract_only = true },
]
probes = [{ row_bytes = 2176, count = 20, source_rows = 300 }, { row_bytes = 4, count = 1, source_rows = 1 }]

[[launcher]]
