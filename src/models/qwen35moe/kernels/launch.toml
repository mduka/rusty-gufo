# Kernel contract for the qwen35moe (Qwen3.6 35B-A3B) text engine
# (docs/development/DESIGN.md). Extents are element counts (bytes for
# `bytes`); the C++ launcher takes `hipStream_t` last unless a `stream`
# parameter places it. Trusted base: a wrong extent compiles and lets a
# kernel overrun its buffer. Review changes like unsafe code; every launcher
# needs probes (tests/extents.rs).
#
# The kernels are the strycast-qwen35moe-gufo-extension's (4882b7a, vendor/:
# include paths and the `strycast` namespace adapted, plus the host-only
# changes listed in vendor/VENDOR.md), compiled with the flags of its C++
# build on Gufo 0fb50ce4 (extension.cmake, compile_commands.json). Launchers
# of a kernel the dense Qwen kernels also have keep gufo-qwen-kernels' name
# and Rust signature; new routes of a changed kernel (the 8-bit KV cache,
# wider SSM replay rings, the fused SSM convolution) are separate launchers.
#
# Caches are token-major [layer][max_context][kv heads * head_dim]: FP16, or
# 272 bytes per (position, KV head) for the 8-bit cache (kv_q8.hpp). Tiled
# Q8_1 activations take 640 bytes per 16 rows and 32 values (576 of codes and
# scales, 64 of sums); the prefill GEMMs read whole 128-row tiles of them.

[library]
name = "qwen35moe"
root = "../../../.."
namespace = "gufo::models::qwen35moe::hip"
format_type = "gufo::core::GgmlType"
headers = [
  "src/models/qwen35moe/kernels/vendor/family/kernels/ops.hpp",
  "src/models/qwen35moe/kernels/vendor/family/kernels/ops/moe.hpp",
  "src/models/qwen35moe/kernels/vendor/family/kernels/ops/prefill_fp16.hpp",
  "src/models/qwen35moe/kernels/vendor/family/kernels/dflash_kernels.hpp",
  "src/models/qwen35moe/kernels/vendor/family/kernels/verify_gemm_27b.hpp",
  "src/models/qwen35moe/kernels/vendor/fnext/kernels/rocm/kernels.hpp",
  "src/models/qwen35moe/kernels/adapters.hpp",
]

