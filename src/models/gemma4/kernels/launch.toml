# Kernel contract for the Gemma 4 kernels (docs/development/DESIGN.md). Extents are element
# counts (bytes for `bytes`); the launchers take `hipStream_t` last. Trusted
# base: a wrong extent compiles and lets a kernel overrun its buffer. Review
# changes like unsafe code; every launcher needs probes (tests/extents.rs).
#
# The kernels are the extension's (franzmoca/gemma4-gufo-extension a31ce42),
# compiled with its CMake target's flags. The flat adapters of
# rocm/adapters.hpp take the place of its argument structs.
#
# Block sizes: Q4_0 18 bytes per 32 values, Q8_0 34, Q4_K 144 per 256, Q5_K
# 176, Q6_K 210. Tiled Q8_1 activations take 640 bytes per 16 rows and 32
# values (576 of codes and scales, 64 of sums), and the prefill GEMMs read
# whole 128-row tiles of them. A WMMA projection's scratch holds its
# activation pack (68 bytes per input value) and 3 MiB of split partials.
#
# Caches are binary16 rows per key: K (or, for derived keys, the rotated
# dims only: 2 * rope_pairs values per KV head) and V. Keys of a ring cache
# sit at slot key % ring; the trunk's global caches pass ring = their slot
# count to the launchers that take a ring (the same slot for every key below
# it) and their slot count to the linear attention launchers.

[library]
name = "gemma4"
root = "../../../.."
namespace = "gufo::models::gemma4::rocm"
format_type = "gufo::core::GgmlType"
headers = [
  "src/models/gemma4/kernels/rocm/adapters.hpp",
  "src/models/gemma4/kernels/rocm/gemv.hpp",
  "src/models/gemma4/kernels/rocm/half_gemm.hpp",
  "src/models/gemma4/kernels/rocm/kernels.hpp",
  "src/models/gemma4/kernels/rocm/moe.hpp",
  "src/models/gemma4/kernels/rocm/ggml/gemm.hpp",
  "src/models/gemma4/kernels/rocm/ggml/token.hpp",
]

# The extension's gufo_gemma4_hip sources (extension.cmake), over the preset's
# -O2 -g -DNDEBUG: fast math with finite-math checks kept ...
[[source]]
path = "src/models/gemma4/kernels/rocm/candidates.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/gemma4/kernels/rocm/kernels.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/gemma4/kernels/rocm/moe_prefill.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
[[source]]
path = "src/models/gemma4/kernels/rocm/half_gemm.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
# ... vision/encoder.hip, whose kernels adapters_vision.hip includes ...
[[source]]
path = "src/models/gemma4/kernels/rocm/adapters_vision.hip"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
# ... strict floating point for the decode and prefill attention and
# projections ...
[[source]]
path = "src/models/gemma4/kernels/rocm/attention_wmma.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument", "-fno-fast-math", "-ffp-contract=off"]
[[source]]
path = "src/models/gemma4/kernels/rocm/gemv.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument", "-fno-fast-math", "-ffp-contract=off"]
[[source]]
path = "src/models/gemma4/kernels/rocm/moe.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument", "-fno-fast-math", "-ffp-contract=off"]
[[source]]
path = "src/models/gemma4/kernels/rocm/wmma_gemv.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument", "-fno-fast-math", "-ffp-contract=off"]
# ... the GGML kernels at the preset's flags ...
[[source]]
path = "src/models/gemma4/kernels/rocm/ggml/argmax.hip.cpp"
[[source]]
path = "src/models/gemma4/kernels/rocm/ggml/gemv.hip.cpp"
[[source]]
path = "src/models/gemma4/kernels/rocm/ggml/gemv_quant.hip.cpp"
[[source]]
path = "src/models/gemma4/kernels/rocm/ggml/prefill_embed.hip.cpp"
[[source]]
