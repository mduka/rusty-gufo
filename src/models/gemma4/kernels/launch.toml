flags = ["-mwavefrontsize64", "-fno-slp-vectorize"]
# The adapters (C++ of this port, at the preset's flags; the routing table
# kernels are integer only).
[[source]]
path = "src/models/gemma4/kernels/rocm/adapters.hip"
[[source]]
path = "src/models/gemma4/kernels/rocm/adapters_routing.hip"

# --- Norms (kernels.hpp) -----------------------------------------------------

[[launcher]]
name = "scale_rms_norm"
cpp = "ScaleRmsNorm"
returns = "void"
doc = "`x[r] *= scale; h[r] = rms(x[r]) * weight`: the scaled token embedding and the first attention norm."
params = [
  { name = "x", kind = "inout", elem = "f32", len = "rows * dim" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "weight", kind = "in", elem = "f32", len = "dim" },
  { name = "h", kind = "out", elem = "f32", len = "rows * dim" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1", "dim >= 1"]
probes = [
  { scale = 2.0, rows = 3, dim = 2816, eps = 1e-6 },
  { scale = 1.0, rows = 1, dim = 1, eps = 1e-6 },
]

[[launcher]]
name = "rms_norm"
cpp = "RmsNorm"
returns = "void"
doc = "`y[r] = rms(x[r]) * weight` (no weight: `rms(x[r])`)."
params = [
  { name = "x", kind = "in", elem = "f32", len = "rows * dim" },
  { name = "weight", kind = "in", elem = "f32", len = "dim", optional = true },
  { name = "y", kind = "out", elem = "f32", len = "rows * dim" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1", "dim >= 1"]
probes = [
  { rows = 3, dim = 2816, eps = 1e-6, with = ["weight"] },
  { rows = 1, dim = 7, eps = 1e-6 },
]

[[launcher]]
name = "post_attention_norm"
cpp = "flat::PostAttentionNorm"
returns = "supported"
doc = "`x[r] += rms(o[r]) * post_norm; h[r] = rms(x[r]) * next_norm`, `h` as F32 rows, binary16 rows (`h_half`) and/or the tiled Q8_1 prefill activation (`q8`, which replaces both); with `pack_scratch` (decode rows: no `q8`, 16 rows at most) the h rows also fill the activation pack of a WMMA projection of width `dim`."
params = [
  { name = "o", kind = "in", elem = "f32", len = "rows * dim" },
  { name = "post_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "x", kind = "inout", elem = "f32", len = "rows * dim" },
  { name = "next_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "h", kind = "out", elem = "f32", len = "rows * dim", optional = true },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "q8", kind = "out", elem = "bytes", len = "((rows + 15) / 16) * (dim / 32) * 640", optional = true },
  { name = "second_norm", kind = "const", cpp_type = "const float*", value = "nullptr" },
  { name = "h2", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "h_half", kind = "out", elem = "f16", len = "rows * dim", optional = true },
  { name = "h2_half", kind = "const", cpp_type = "void*", value = "nullptr" },
  { name = "pack_scratch", kind = "out", elem = "bytes", len = "68 * dim", optional = true },
]
requires = ["rows >= 1", "dim >= 32", "dim <= 6144", "dim % 32 == 0"]
probes = [
  { rows = 3, dim = 2816, eps = 1e-6, with = ["h", "h_half", "pack_scratch"] },
  { rows = 40, dim = 5376, eps = 1e-6, with = ["q8"] },
  { rows = 17, dim = 64, eps = 1e-6, with = ["h"] },
]

[[launcher]]
name = "post_attention_norm_moe"
cpp = "flat::PostAttentionNorm"
returns = "supported"
doc = "`post_attention_norm` of an expert layer, which also writes the experts' input `h2[r] = rms(x[r]) * second_norm` as F32 and/or binary16 rows."
params = [
  { name = "o", kind = "in", elem = "f32", len = "rows * dim" },
  { name = "post_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "x", kind = "inout", elem = "f32", len = "rows * dim" },
  { name = "next_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "h", kind = "out", elem = "f32", len = "rows * dim", optional = true },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "q8", kind = "out", elem = "bytes", len = "((rows + 15) / 16) * (dim / 32) * 640", optional = true },
  { name = "second_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "h2", kind = "out", elem = "f32", len = "rows * dim", optional = true },
  { name = "h_half", kind = "out", elem = "f16", len = "rows * dim", optional = true },
  { name = "h2_half", kind = "out", elem = "f16", len = "rows * dim", optional = true },
  { name = "pack_scratch", kind = "out", elem = "bytes", len = "68 * dim", optional = true },
]
requires = ["rows >= 1", "dim >= 32", "dim <= 6144", "dim % 32 == 0"]
probes = [
  { rows = 3, dim = 2816, eps = 1e-6, with = ["h", "h2", "pack_scratch"] },
  { rows = 40, dim = 2816, eps = 1e-6, with = ["h_half", "h2_half"] },
]

[[launcher]]
name = "post_feed_forward_norm"
cpp = "flat::PostFeedForwardNorm"
returns = "supported"
doc = "`x[r] = (x[r] + rms(f[r]) * post_norm) * scale; h[r] = rms(x[r]) * next_norm` (no `next_norm`: no h), `h` as in `post_attention_norm`."
params = [
  { name = "f", kind = "in", elem = "f32", len = "rows * dim" },
  { name = "post_norm", kind = "in", elem = "f32", len = "dim" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "x", kind = "inout", elem = "f32", len = "rows * dim" },
  { name = "next_norm", kind = "in", elem = "f32", len = "dim", optional = true },
  { name = "h", kind = "out", elem = "f32", len = "rows * dim", optional = true },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "q8", kind = "out", elem = "bytes", len = "((rows + 15) / 16) * (dim / 32) * 640", optional = true },
  { name = "h_half", kind = "out", elem = "f16", len = "rows * dim", optional = true },
  { name = "pack_scratch", kind = "out", elem = "bytes", len = "68 * dim", optional = true },
]
requires = ["rows >= 1", "dim >= 32", "dim <= 6144", "dim % 32 == 0"]
probes = [
  { scale = 0.5, rows = 3, dim = 2816, eps = 1e-6, with = ["next_norm", "h", "pack_scratch"] },
  { scale = 1.0, rows = 33, dim = 5376, eps = 1e-6, with = ["next_norm", "q8"] },
  { scale = 1.0, rows = 2, dim = 64, eps = 1e-6 },
]

# --- Q/K/V post-processing (kernels.hpp) -------------------------------------

[[launcher]]
name = "qkv_post"
cpp = "flat::QkvPostInPlace"
returns = "supported"
doc = "Per head: `q = rope(rms(q) * q_norm)` in place; K = rope(rms(k) * k_norm) and V = rms(v) as binary16 into the caches at slot key % ring (key: the row's position, or `spare_key + i` for sibling i of the last `siblings` rows). `v` may be a view of `k` (global layers' shared projection); V rows are `v_stride` floats apart."
params = [
  { name = "q", kind = "inout", elem = "f32", len = "rows * heads * head_dim" },
  { name = "k", kind = "in", elem = "f32", len = "rows * kv_heads * head_dim" },
  { name = "v", kind = "in", elem = "f32", len = "(rows - 1) * v_stride + kv_heads * head_dim" },
  { name = "q_norm", kind = "in", elem = "f32", len = "head_dim" },
  { name = "k_norm", kind = "in", elem = "f32", len = "head_dim" },
  { name = "theta_scale", kind = "scalar", type = "f32" },
  { name = "freq_factors", kind = "in", elem = "f32", len = "head_dim / 2", optional = true },
  { name = "k_cache", kind = "out", elem = "f16", len = "ring * kv_heads * head_dim" },
  { name = "v_cache", kind = "out", elem = "f16", len = "ring * kv_heads * head_dim" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "heads", kind = "scalar", type = "u32" },
  { name = "kv_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "first_position", kind = "scalar", type = "u32" },
  { name = "ring", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "rotated_pairs", kind = "const", cpp_type = "std::uint32_t", value = "0" },
  { name = "v_stride", kind = "scalar", type = "u32" },
  { name = "siblings", kind = "scalar", type = "u32" },
  { name = "spare_key", kind = "scalar", type = "u32" },
]
requires = ["rows >= 1", "heads >= 1", "kv_heads >= 1", "head_dim >= 256", "head_dim <= 512", "head_dim % 256 == 0", "ring >= 1", "v_stride >= 1", "siblings < rows"]
probes = [
  { theta_scale = 0.9, rows = 3, heads = 16, kv_heads = 8, head_dim = 256, first_position = 70, ring = 64, eps = 1e-6, v_stride = 2048, siblings = 1, spare_key = 72, with = ["freq_factors"] },
  { theta_scale = 0.9, rows = 20, heads = 16, kv_heads = 2, head_dim = 512, first_position = 0, ring = 20, eps = 1e-6, v_stride = 1024, siblings = 0, spare_key = 0 },
]

[[launcher]]
name = "qkv_post_derived"
cpp = "flat::QkvPostInPlace"
returns = "supported"
doc = "`qkv_post` for a derived-key layer: V is the normalized K projection, the K cache keeps only the rotated dims (`rotated_pairs` of each half head) and the unrotated query dims carry `k_norm`."
params = [
  { name = "q", kind = "inout", elem = "f32", len = "rows * heads * head_dim" },
  { name = "k", kind = "in", elem = "f32", len = "rows * kv_heads * head_dim" },
  { name = "v", kind = "in", elem = "f32", len = "(rows - 1) * v_stride + kv_heads * head_dim" },
