  { name = "v_stride", kind = "scalar", type = "u32" },
  { name = "siblings", kind = "scalar", type = "u32" },
  { name = "spare_key", kind = "scalar", type = "u32" },
]
requires = ["rows >= 1", "heads >= 1", "kv_heads >= 1", "head_dim >= 256", "head_dim <= 512", "head_dim % 256 == 0", "ring >= 1", "v_stride >= 1", "siblings < rows", "rotated_pairs >= 1", "rotated_pairs * 2 <= head_dim"]
