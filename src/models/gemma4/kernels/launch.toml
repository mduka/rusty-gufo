# Routing writes each row's `used` expert IDs; the group table of the routed
# GEMV and the per-expert counts of the prefill buckets derive from exactly
# those IDs (`expert_groups`, `expert_counts`), so their consumers can
# require them. Trusted: for rows with finite logits the IDs are below
