  { name = "k_norm", kind = "in", elem = "f32", len = "head_dim" },
  { name = "theta_scale", kind = "scalar", type = "f32" },
  { name = "freq_factors", kind = "in", elem = "f32", len = "head_dim / 2", optional = true },
  { name = "k_cache", kind = "out", elem = "f16", len = "ring * kv_heads * 2 * rotated_pairs" },
  { name = "v_cache", kind = "out", elem = "f16", len = "ring * kv_heads * head_dim" },
  { name = "rows", kind = "scalar", type = "u32" },
  { name = "heads", kind = "scalar", type = "u32" },
  { name = "kv_heads", kind = "scalar", type = "u32" },
  { name = "head_dim", kind = "scalar", type = "u32" },
  { name = "first_position", kind = "scalar", type = "u32" },
  { name = "ring", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
