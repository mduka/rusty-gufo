[[launcher]]
name = "sliding_causal_attention"
cpp = "LaunchSlidingCausalAttention"
returns = "void"
doc = "f32 sliding-window causal attention of `frames` queries at `query_offset` over `key_frames` keys `[frame][head][head_dimension]`."
params = [
  { name = "query", kind = "in", elem = "f32", len = "frames * heads * head_dimension" },
  { name = "key", kind = "in", elem = "f32", len = "key_frames * heads * head_dimension" },
  { name = "value", kind = "in", elem = "f32", len = "key_frames * heads * head_dimension" },
  { name = "output", kind = "out", elem = "f32", len = "frames * heads * head_dimension" },
  { name = "frames", kind = "scalar", type = "usize" },
  { name = "heads", kind = "scalar", type = "usize" },
  { name = "head_dimension", kind = "scalar", type = "usize" },
  { name = "sliding_window", kind = "scalar", type = "usize" },
  { name = "stream", kind = "stream" },
  { name = "query_offset", kind = "scalar", type = "usize" },
