probes = [
  { rows = 1, columns = 2048, out = 40, accumulate = false, splits = 1, blocks_per_split = 64, partial_floats = 0, counter_count = 0 },
  { rows = 22, columns = 1024, out = 33, accumulate = true, splits = 4, blocks_per_split = 8, partial_floats = 2904, counter_count = 3, with = ["partials", "counters"] },
  { rows = 16, columns = 96, out = 17, accumulate = false, splits = 3, blocks_per_split = 1, partial_floats = 816, counter_count = 2, with = ["partials", "counters"] },
  { rows = 32, columns = 64, out = 1, accumulate = false, splits = 2, blocks_per_split = 1, partial_floats = 64, counter_count = 1, with = ["partials", "counters"] },
