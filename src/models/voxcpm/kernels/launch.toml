[[launcher]]
name = "concat_rows"
cpp = "ConcatRows"
returns = "void"
doc = "Writes bf16 rows `[a[row] * a_scale[row] | b[row] * b_scale[row]]` of widths `a_width + b_width`; absent scales are 1."
params = [
  { name = "a", kind = "in", elem = "f32", len = "rows * a_width" },
  { name = "a_scale", kind = "in", elem = "f32", len = "rows", optional = true },
  { name = "a_width", kind = "scalar", type = "usize" },
  { name = "b", kind = "in", elem = "f32", len = "rows * b_width" },
  { name = "b_scale", kind = "in", elem = "f32", len = "rows", optional = true },
  { name = "b_width", kind = "scalar", type = "usize" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * (a_width + b_width)" },
  { name = "rows", kind = "scalar", type = "usize" },
]
requires = ["rows >= 1"]
