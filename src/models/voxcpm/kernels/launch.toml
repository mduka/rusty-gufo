[[launcher]]
name = "to_bf16"
cpp = "ToBf16"
returns = "void"
doc = "`output = bf16(input)`, optionally through silu."
params = [
  { name = "input", kind = "in", elem = "f32", len = "count" },
  { name = "output", kind = "out", elem = "bf16", len = "count" },
  { name = "count", kind = "scalar", type = "usize" },
  { name = "silu", kind = "scalar", type = "bool" },
]
requires = ["count >= 1"]
