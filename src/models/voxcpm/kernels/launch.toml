# --- Generator (generator_kernels.hpp) ---------------------------------------

[[launcher]]
name = "embed"
cpp = "Embed"
returns = "void"
doc = "Rows with `text_mask[row]` take `table[ids[row]] * scale`; the others are zero (their IDs must still name a row)."
params = [
  { name = "table", kind = "in", elem = "bf16", len = "vocab * width" },
  { name = "ids", kind = "indices", signed = true, len = "rows", below = "vocab" },
  { name = "text_mask", kind = "in", elem = "i32", len = "rows" },
  { name = "output", kind = "out", elem = "f32", len = "rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "vocab", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["vocab >= 1"]
probes = [
  { rows = 5, width = 2048, scale = 1.0, vocab = 7 },
  { rows = 1, width = 3, scale = 12.0, vocab = 1 },
  { rows = 0, width = 8, scale = 1.0, vocab = 1 },
]

[[launcher]]
name = "scatter_rows"
cpp = "ScatterRows"
returns = "void"
doc = "`output[indices[i]] = input[i]` for rows of `width` floats."
params = [
  { name = "input", kind = "in", elem = "f32", len = "rows * width" },
  { name = "indices", kind = "indices", signed = true, len = "rows", below = "output_rows" },
  { name = "output", kind = "inout", elem = "f32", len = "output_rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "output_rows", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["output_rows >= 1"]
probes = [
  { rows = 3, width = 2048, output_rows = 9 },
  { rows = 1, width = 5, output_rows = 1 },
  { rows = 0, width = 5, output_rows = 1 },
]

[[launcher]]
name = "gather_rows"
cpp = "GatherRows"
returns = "void"
doc = "`output[i] = input[indices[i]]` for rows of `width` floats."
params = [
  { name = "input", kind = "in", elem = "f32", len = "input_rows * width" },
  { name = "indices", kind = "indices", signed = true, len = "rows", below = "input_rows" },
  { name = "output", kind = "out", elem = "f32", len = "rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "input_rows", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["input_rows >= 1"]
probes = [
  { rows = 3, width = 1024, input_rows = 22 },
  { rows = 1, width = 5, input_rows = 1 },
  { rows = 0, width = 5, input_rows = 1 },
]

[[launcher]]
name = "rms_norm"
cpp = "RmsNorm"
returns = "void"
doc = "`output = bf16(weight * x * rsqrt(mean(x^2) + epsilon))` per row; with `output_f32`, also the float value."
params = [
  { name = "input", kind = "in", elem = "f32", len = "rows * width" },
  { name = "weight", kind = "in", elem = "bf16", len = "width" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * width" },
  { name = "output_f32", kind = "out", elem = "f32", len = "rows * width", optional = true },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
  { name = "epsilon", kind = "scalar", type = "f32" },
]
requires = ["rows >= 1"]
probes = [
  { rows = 3, width = 2048, epsilon = 1e-5 },
  { rows = 1, width = 7, epsilon = 1e-5, with = ["output_f32"] },
]

[[launcher]]
name = "qkv_rope"
cpp = "QkvRope"
returns = "void"
doc = "Splits the fused projection `[q heads | k heads | v heads]` of each row, rotates q and k with the table's cos/sin row `positions[row]` (`[cos half | sin half]`; no rotation without a table), writes q as `[rows][heads][head_dim]` and k, v into the caches `[kv_heads][capacity][head_dim]` at `cache_rows[row]`."
params = [
  { name = "qkv", kind = "in", elem = "f32", len = "rows * (heads + 2 * kv_heads) * head_dim" },
  { name = "cos_sin", kind = "in", elem = "f32", len = "table_rows * head_dim", optional = true },
  { name = "positions", kind = "indices", signed = true, len = "rows", below = "table_rows" },
  { name = "cache_rows", kind = "indices", signed = true, len = "rows", below = "capacity" },
  { name = "q", kind = "out", elem = "f32", len = "rows * heads * head_dim" },
  { name = "k_cache", kind = "inout", elem = "f32", len = "kv_heads * capacity * head_dim" },
  { name = "v_cache", kind = "inout", elem = "f32", len = "kv_heads * capacity * head_dim" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "heads", kind = "scalar", type = "usize" },
  { name = "kv_heads", kind = "scalar", type = "usize" },
  { name = "head_dim", kind = "scalar", type = "usize" },
  { name = "capacity", kind = "scalar", type = "usize" },
  { name = "table_rows", kind = "scalar", type = "usize", contract_only = true },
]
requires = ["rows >= 1", "capacity >= 1", "table_rows >= 1"]
probes = [
  { rows = 3, heads = 16, kv_heads = 2, head_dim = 128, capacity = 9, table_rows = 9, with = ["cos_sin"] },
  { rows = 22, heads = 16, kv_heads = 16, head_dim = 128, capacity = 22, table_rows = 11 },
  { rows = 1, heads = 1, kv_heads = 1, head_dim = 6, capacity = 1, table_rows = 1, with = ["cos_sin"] },
]

[[launcher]]
name = "attention"
cpp = "Attention"
returns = "void"
doc = "Attention of each q row over the cached keys: row `r` belongs to sequence `r / rows_per_sequence`, whose keys start at cache row `sequence * keys_per_sequence`; it sees `past` earlier keys plus the sequence's rows up to itself (`causal`) or all of them. Writes bf16 `[rows][heads * head_dim]`; `head_dim` is 128."
params = [
  { name = "q", kind = "in", elem = "f32", len = "rows * heads * head_dim" },
  { name = "k_cache", kind = "in", elem = "f32", len = "kv_heads * capacity * head_dim" },
  { name = "v_cache", kind = "in", elem = "f32", len = "kv_heads * capacity * head_dim" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * heads * head_dim" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "rows_per_sequence", kind = "scalar", type = "usize" },
  { name = "keys_per_sequence", kind = "scalar", type = "usize" },
  { name = "past", kind = "scalar", type = "usize" },
  { name = "causal", kind = "scalar", type = "bool" },
  { name = "heads", kind = "scalar", type = "usize" },
  { name = "kv_heads", kind = "scalar", type = "usize" },
  { name = "head_dim", kind = "scalar", type = "usize" },
  { name = "capacity", kind = "scalar", type = "usize" },
]
# The last sequence's keys end at `(sequences - 1) * keys_per_sequence +
# past + rows_per_sequence`, inside the cache.
requires = [
  "head_dim == 128",
  "rows >= 1",
  "rows_per_sequence >= 1",
  "kv_heads >= 1",
  "heads % kv_heads == 0",
  "((rows + rows_per_sequence - 1) / rows_per_sequence - 1) * keys_per_sequence + past + rows_per_sequence <= capacity",
]
probes = [
  { rows = 5, rows_per_sequence = 5, keys_per_sequence = 0, past = 3, causal = true, heads = 16, kv_heads = 2, head_dim = 128, capacity = 9 },
  { rows = 22, rows_per_sequence = 11, keys_per_sequence = 11, past = 0, causal = false, heads = 16, kv_heads = 16, head_dim = 128, capacity = 22 },
  { rows = 1, rows_per_sequence = 1, keys_per_sequence = 0, past = 0, causal = true, heads = 2, kv_heads = 1, head_dim = 128, capacity = 1 },
]

[[launcher]]
name = "swi_glu"
cpp = "SwiGlu"
returns = "void"
doc = "`output[row][i] = bf16(silu(gate_up[row][i]) * gate_up[row][width + i])`."
params = [
  { name = "gate_up", kind = "in", elem = "f32", len = "rows * 2 * width" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * width" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "width", kind = "scalar", type = "usize" },
]
