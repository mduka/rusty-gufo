# Kernel contract for the VoxCPM2 kernels (docs/development/DESIGN.md).
# Extents are element counts (bytes for `u8`); the C++ launcher takes
# `hipStream_t` last. Trusted base: a wrong extent compiles and lets a kernel
# overrun its buffer. Review changes like unsafe code; every launcher needs
# probes (tests/extents.rs).
#
# The kernels are the VoxCPM extension's (gufo-extensions/voxcpm 0941cd1,
# kernels/), copied verbatim into ../hip. bfloat16 travels as raw
# `std::uint16_t` bits there, float16 too (the GGUF conversion's input).
# Launchers whose C++ signature the contract cannot describe directly (the
# matrix-core products' plan and scratch structs) go through adapters.hip.

[library]
name = "voxcpm"
root = "../../../.."
namespace = "gufo::models::voxcpm::kernels"
f16_type = "std::uint16_t"
bf16_type = "std::uint16_t"
headers = [
  "src/models/voxcpm/hip/convert_kernels.hpp",
  "src/models/voxcpm/hip/generator_kernels.hpp",
  "src/models/voxcpm/hip/skinny_gemm.hpp",
  "src/models/voxcpm/hip/vae_kernels.hpp",
  "src/models/voxcpm/hip/wmma_products.hpp",
  "src/models/voxcpm/kernels/adapters.hpp",
]

# The extension's gufo_voxcpm_hip target: the preset's -O2, then -O3 from its
# own options (extension.cmake).
[[source]]
path = "src/models/voxcpm/hip/generator_kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

[[source]]
path = "src/models/voxcpm/hip/vae_kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

[[source]]
path = "src/models/voxcpm/hip/skinny_gemm.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

[[source]]
path = "src/models/voxcpm/hip/wmma_products.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

[[source]]
path = "src/models/voxcpm/hip/convert_kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

# Host code only: the flat forms of the matrix-core products.
[[source]]
path = "src/models/voxcpm/kernels/adapters.hip"

# --- Load-time conversions (convert_kernels.hpp) -----------------------------

[[launcher]]
name = "half_to_bf16"
cpp = "HalfToBf16"
returns = "void"
doc = "`output[i] = bf16(input[i])` for float16 input."
params = [
  { name = "input", kind = "in", elem = "f16", len = "count" },
  { name = "output", kind = "out", elem = "bf16", len = "count" },
  { name = "count", kind = "scalar", type = "usize" },
]
probes = [{ count = 1000 }, { count = 1 }, { count = 0 }]

[[launcher]]
name = "float_to_bf16"
cpp = "FloatToBf16"
returns = "void"
doc = "`output[i] = bf16(input[i])`, rounded to nearest even."
params = [
  { name = "input", kind = "in", elem = "f32", len = "count" },
  { name = "output", kind = "out", elem = "bf16", len = "count" },
  { name = "count", kind = "scalar", type = "usize" },
]
probes = [{ count = 1000 }, { count = 1 }, { count = 0 }]

[[launcher]]
name = "q8_0_to_bf16"
cpp = "Q8_0ToBf16"
returns = "void"
doc = "Dequantizes GGML Q8_0 blocks (a float16 scale and 32 int8 values, 34 bytes) to bfloat16: `output[i] = bf16(scale * value)`."
params = [
  { name = "blocks", kind = "in", elem = "u8", len = "(count + 31) / 32 * 34" },
  { name = "output", kind = "out", elem = "bf16", len = "count" },
  { name = "count", kind = "scalar", type = "usize" },
]
probes = [{ count = 2048 }, { count = 33 }, { count = 0 }]

# --- Weight tiles of the matrix-core products (wmma_products.hpp) -----------
# A tile holds 16 weight rows and 32 columns: Q8_0 544 bytes (512 values and
# 16 float16 scales), bfloat16 512 values; rows beyond the matrix are zero.

[[launcher]]
name = "q8_0_to_tiles"
cpp = "Q8_0ToTiles"
returns = "void"
doc = "Repacks GGML Q8_0 blocks `[rows][columns / 32]` into tiles; `output` must already be zero beyond the last row's tile rows."
params = [
  { name = "blocks", kind = "in", elem = "u8", len = "rows * (columns / 32) * 34" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "output", kind = "inout", elem = "u8", len = "(rows + 15) / 16 * (columns / 32) * 544" },
]
# The kernel indexes with int.
requires = ["columns % 32 == 0", "rows * columns <= 2147483647"]
probes = [{ rows = 40, columns = 96 }, { rows = 16, columns = 32 }, { rows = 1, columns = 2048 }]

[[launcher]]
name = "bf16_to_tiles"
cpp = "Bf16ToTiles"
returns = "void"
doc = "Repacks bfloat16 `[rows][columns]` into tiles; `output` must already be zero beyond the last row's tile rows."
params = [
  { name = "weights", kind = "in", elem = "bf16", len = "rows * columns" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "output", kind = "inout", elem = "bf16", len = "(rows + 15) / 16 * (columns / 32) * 512" },
]
requires = ["columns % 32 == 0", "rows * columns <= 2147483647"]
probes = [{ rows = 40, columns = 96 }, { rows = 16, columns = 32 }, { rows = 1, columns = 2048 }]

[[launcher]]
name = "q8_tiles_to_bf16"
cpp = "Q8TilesToBf16"
returns = "void"
doc = "Dequantizes Q8_0 tiles to bfloat16 `[rows][columns]`: `bf16(scale * q)`, the rounding of a conversion at load (products of more than 128 rows)."
params = [
  { name = "tiles", kind = "in", elem = "u8", len = "(rows + 15) / 16 * (columns / 32) * 544" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * columns" },
]
requires = ["columns % 32 == 0", "rows * columns <= 2147483647"]
probes = [{ rows = 40, columns = 96 }, { rows = 16, columns = 32 }, { rows = 1, columns = 2048 }]

[[launcher]]
name = "bf16_tiles_to_rows"
cpp = "Bf16TilesToRows"
returns = "void"
doc = "Unpacks bfloat16 tiles to `[rows][columns]`."
params = [
  { name = "tiles", kind = "in", elem = "bf16", len = "(rows + 15) / 16 * (columns / 32) * 512" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "output", kind = "out", elem = "bf16", len = "rows * columns" },
]
requires = ["columns % 32 == 0", "rows * columns <= 2147483647"]
probes = [{ rows = 40, columns = 96 }, { rows = 16, columns = 32 }, { rows = 1, columns = 2048 }]

# --- Products (skinny_gemm.hpp, wmma_products.hpp via adapters.hip) ----------

[[launcher]]
name = "skinny_gemm"
cpp = "SkinnyGemmChecked"
returns = "supported"
doc = "`y[rows][out] (+)= x[rows][columns] W^T` for bfloat16 x and W (`[out][columns]`) with float32 sums, every weight read once (`SkinnyGemm`). Unsupported for more than 32 rows or `columns` not a multiple of 8, and for the shapes adapters.hip refuses."
params = [
  { name = "x", kind = "in", elem = "bf16", len = "rows * columns" },
  { name = "w", kind = "in", elem = "bf16", len = "out * columns" },
  { name = "y", kind = "inout", elem = "f32", len = "rows * out" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "out", kind = "scalar", type = "usize" },
  { name = "accumulate", kind = "scalar", type = "bool" },
]
# The kernels index with int and clamp the weight row to `out - 1`.
requires = ["out >= 1", "rows * columns <= 2147483647", "out * columns <= 2147483647"]
probes = [
  { rows = 1, columns = 2048, out = 37, accumulate = false },
  { rows = 4, columns = 6144, out = 20, accumulate = true },
  { rows = 8, columns = 1000, out = 9, accumulate = false },
  { rows = 11, columns = 2048, out = 17, accumulate = true },
  { rows = 22, columns = 1024, out = 3, accumulate = false },
  { rows = 32, columns = 4096, out = 9, accumulate = false },
  { rows = 9, columns = 8192, out = 5, accumulate = false },
]

[[launcher]]
name = "wmma_q8"
cpp = "WmmaQ8Flat"
returns = "supported"
doc = "`y[rows][out] (+)= x[rows][columns] W^T` for bfloat16 x and Q8_0 tiles W on the matrix cores (`WmmaQ8`), split over `splits` waves of `blocks_per_split` 32-column blocks each (`PlanWmma`). The split scratch (partials, counters zero between products) may be absent for one split. Unsupported (nothing launched) for 0 or more than 32 rows, `columns` not a multiple of 32, a plan that does not cover the reduction or scratch smaller than the plan needs."
params = [
  { name = "x", kind = "in", elem = "bf16", len = "rows * columns" },
  { name = "w", kind = "in", elem = "u8", len = "(out + 15) / 16 * (columns / 32) * 544" },
  { name = "y", kind = "inout", elem = "f32", len = "rows * out" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "out", kind = "scalar", type = "usize" },
  { name = "accumulate", kind = "scalar", type = "bool" },
  { name = "splits", kind = "scalar", type = "usize" },
  { name = "blocks_per_split", kind = "scalar", type = "usize" },
  { name = "partials", kind = "inout", elem = "f32", len = "partial_floats", optional = true },
  { name = "partial_floats", kind = "scalar", type = "usize" },
  { name = "counters", kind = "inout", elem = "u32", len = "counter_count", optional = true },
  { name = "counter_count", kind = "scalar", type = "usize" },
]
# The kernel indexes with int (grid rows: the splits).
requires = [
  "out >= 1",
  "rows * columns <= 2147483647",
  "rows * out <= 2147483647",
  "splits <= 65535",
  "splits * blocks_per_split <= 2147483647",
]
probes = [
  { rows = 1, columns = 2048, out = 40, accumulate = false, splits = 1, blocks_per_split = 64, partial_floats = 0, counter_count = 0 },
  { rows = 22, columns = 1024, out = 33, accumulate = true, splits = 4, blocks_per_split = 8, partial_floats = 2904, counter_count = 3, with = ["partials", "counters"] },
  { rows = 16, columns = 96, out = 17, accumulate = false, splits = 3, blocks_per_split = 1, partial_floats = 816, counter_count = 2, with = ["partials", "counters"] },
  { rows = 32, columns = 64, out = 1, accumulate = false, splits = 2, blocks_per_split = 1, partial_floats = 64, counter_count = 1, with = ["partials", "counters"] },
]

[[launcher]]
name = "wmma_bf16"
