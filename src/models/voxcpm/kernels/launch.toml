# --- AudioVAE V2 (vae_kernels.hpp) -------------------------------------------
# Time-major `[frames][channels]`; a causal convolution reads its history
# frames before the first output frame.

[[launcher]]
name = "snake"
cpp = "Snake"
returns = "void"
doc = "`output = x + sin(alpha * x)^2 / (alpha + 1e-9)` per channel."
params = [
  { name = "input", kind = "in", elem = "f32", len = "frames * channels" },
  { name = "output", kind = "out", elem = "f32", len = "frames * channels" },
  { name = "frames", kind = "scalar", type = "usize" },
  { name = "channels", kind = "scalar", type = "usize" },
  { name = "alpha", kind = "in", elem = "f32", len = "channels" },
  { name = "scale", kind = "const", cpp_type = "const float*", value = "nullptr" },
  { name = "bias", kind = "const", cpp_type = "const float*", value = "nullptr" },
]
