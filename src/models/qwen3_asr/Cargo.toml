[package]
name = "gufo-qwen3-asr"
version = "0.0.0"
description = "Qwen3-ASR-1.7B speech recognition on gfx1151"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The C++ sources, kernels and tools of this model share the directory.
include = ["Cargo.toml", "build.rs", "src/**/*.rs", "tests/*.rs"]

[features]
# Tests that need a gfx1151 device: cargo test -p gufo-qwen3-asr --features gpu
gpu = []

[dependencies]
gufo-core.workspace = true
gufo-hip.workspace = true
gufo-qwen3-asr-kernels = { path = "kernels" }
serde_json.workspace = true

[build-dependencies]
gufo-kernel-build.workspace = true

[lints]
workspace = true
