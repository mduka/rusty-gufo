  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "epsilon", kind = "scalar", type = "f32" },
]
probes = [
  { rows = 4, columns = 1024, epsilon = 1e-5 },
  { rows = 1, columns = 3, epsilon = 1e-5 },
]

[[launcher]]
name = "bias_round_bf16"
cpp = "LaunchBiasRoundBfloat16"
