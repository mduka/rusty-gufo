[[launcher]]
name = "argmax_rows"
cpp = "ArgmaxRowsFlat"
returns = "void"
doc = "`best[r]` = the packed arg max of `logits[r] + bias` over `columns`: the order-preserving bits of the value high, `0xFFFFFFFF - column` low (the first column among equals)."
params = [
  { name = "logits", kind = "in", elem = "f32", len = "rows * columns" },
  { name = "bias", kind = "in", elem = "f32", len = "columns" },
  { name = "rows", kind = "scalar", type = "i32" },
  { name = "columns", kind = "scalar", type = "i32" },
  { name = "best", kind = "out", elem = "u64", len = "rows" },
]
probes = [{ rows = 16, columns = 13313 }, { rows = 1, columns = 3 }, { rows = 0, columns = 3 }]
