  { name = "h", kind = "out", elem = "f32", len = "hidden" },
  { name = "c", kind = "inout", elem = "f32", len = "hidden" },
  { name = "hidden", kind = "scalar", type = "i32" },
]
# The grid needs a column.
requires = ["hidden >= 1"]
probes = [{ hidden = 640 }, { hidden = 1 }]

[[launcher]]
name = "joint_input"
cpp = "JointInput"
