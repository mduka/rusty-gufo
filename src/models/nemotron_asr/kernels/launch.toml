# Kernel contract for the Nemotron 3.5 ASR kernels (docs/development/DESIGN.md).
# Extents are element counts; the C++ launcher takes `hipStream_t` last.
# Trusted base: a wrong extent compiles and lets a kernel overrun its buffer.
# Review changes like unsafe code; every launcher needs probes
# (tests/extents.rs).
#
# The kernels are the Nemotron ASR extension's (gufo-extensions/nemotron_asr
# c256b69, 0.1.2, kernels/), copied verbatim into ../hip. float16 travels as raw
# `std::uint16_t` bits there. Launchers whose C++ signature the contract
# cannot describe directly go through adapters.hip.

[library]
name = "nemotron_asr"
root = "../../../.."
namespace = "gufo::models::nemotron_asr::kernels"
f16_type = "std::uint16_t"
headers = [
  "src/models/nemotron_asr/hip/kernels.hpp",
  "src/models/nemotron_asr/hip/wmma.hpp",
  "src/models/nemotron_asr/kernels/adapters.hpp",
]

# The extension's gufo_nemotron_asr_hip target: the preset's -O2, then -O3
# from its own options (extension.cmake).
[[source]]
path = "src/models/nemotron_asr/hip/kernels.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

[[source]]
path = "src/models/nemotron_asr/hip/wmma.hip"
flags = ["-O3", "-Wno-unused-command-line-argument"]

# Host code only: the flat forms.
[[source]]
path = "src/models/nemotron_asr/kernels/adapters.hip"

# --- Conversions and the matrix-core product (kernels.hpp, wmma.hpp) ---------

[[launcher]]
name = "to_half"
cpp = "ToHalfFlat"
returns = "void"
doc = "`y[i] = f16(x[i])`, rounded to nearest even."
params = [
  { name = "x", kind = "in", elem = "f32", len = "n" },
  { name = "y", kind = "out", elem = "f16", len = "n" },
  { name = "n", kind = "scalar", type = "usize" },
]
probes = [{ n = 1000 }, { n = 1 }, { n = 0 }]

[[launcher]]
name = "half_to_tiles"
cpp = "HalfToTiles"
returns = "void"
doc = "Repacks float16 `[rows][columns]` into the product's tiles of 16 rows by 32 columns, the tiles of 16 rows following each other along the columns."
params = [
  { name = "weights", kind = "in", elem = "f16", len = "rows * columns" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  # A row past the last multiple of 16 lands in a whole tile row.
  { name = "tiles", kind = "out", elem = "f16", len = "(rows + 15) / 16 * 16 * columns" },
]
# The kernel indexes with int.
requires = ["columns % 32 == 0", "(rows + 15) / 16 * 16 * columns <= 2147483647"]
probes = [{ rows = 48, columns = 96 }, { rows = 17, columns = 64 }, { rows = 16, columns = 32 }, { rows = 0, columns = 32 }]

[[launcher]]
name = "wmma_linear"
cpp = "WmmaLinearFlat"
returns = "supported"
doc = "`y[rows][out] = scale * x[rows][columns] W^T`, plus `y` when `accumulate`, plus `bias[out]` when given, then ReLU when `relu`, for float16 x and tiles W on the matrix cores, float32 sums. Unsupported (nothing launched) for 0 rows, `columns` not a multiple of 32 or `out` not a multiple of 16."
params = [
  { name = "x", kind = "in", elem = "f16", len = "rows * columns" },
  { name = "tiles", kind = "in", elem = "f16", len = "out * columns" },
  { name = "y", kind = "inout", elem = "f32", len = "rows * out" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "out", kind = "scalar", type = "usize" },
  { name = "accumulate", kind = "scalar", type = "bool" },
  { name = "scale", kind = "scalar", type = "f32" },
  { name = "bias", kind = "in", elem = "f32", len = "out", optional = true },
  { name = "relu", kind = "scalar", type = "bool" },
]
# The kernel indexes activations with int; the grid's second dimension holds
# the groups of activation rows.
requires = ["rows * columns <= 2147483647", "out <= 2147483647", "rows <= 1048560"]
probes = [
  { rows = 1, columns = 32, out = 16, accumulate = false, scale = 1.0, relu = false },
  { rows = 17, columns = 96, out = 48, accumulate = true, scale = 0.5, relu = false, with = ["bias"] },
  { rows = 140, columns = 1024, out = 80, accumulate = false, scale = 1.0, relu = true, with = ["bias"] },
  { rows = 300, columns = 64, out = 16, accumulate = true, scale = 1.0, relu = false },
]

[[launcher]]
name = "wmma_linear_half"
cpp = "WmmaLinearHalf"
returns = "supported"
doc = "`y[rows][out] = x[rows][columns] W^T`, plus `bias[out]` when given, then ReLU when `relu`, stored as float16, for float16 x and tiles W on the matrix cores, float32 sums. Unsupported (nothing launched) for the shapes `wmma_linear` refuses."
params = [
  { name = "x", kind = "in", elem = "f16", len = "rows * columns" },
  { name = "tiles", kind = "in", elem = "f16", len = "out * columns" },
  { name = "y", kind = "out", elem = "f16", len = "rows * out" },
  { name = "rows", kind = "scalar", type = "usize" },
  { name = "columns", kind = "scalar", type = "usize" },
  { name = "out", kind = "scalar", type = "usize" },
  { name = "bias", kind = "in", elem = "f32", len = "out", optional = true },
  { name = "relu", kind = "scalar", type = "bool" },
]
requires = ["rows * columns <= 2147483647", "out <= 2147483647", "rows <= 1048560"]
probes = [
  { rows = 1, columns = 32, out = 16, relu = false },
  { rows = 1105, columns = 256, out = 256, relu = true, with = ["bias"] },
  { rows = 14, columns = 1024, out = 2048, relu = true, with = ["bias"] },
]

# --- Subsampling --------------------------------------------------------------

[[launcher]]
name = "subsample_input"
cpp = "SubsampleInput"
returns = "void"
doc = "The stem: a 3x3 stride-2 convolution of the single-channel mel spectrogram `[rows][bins]` (frequency padded by 2 before and 1 after), plus bias, then ReLU: `out [out_rows][out_freq][channels]` as float16; reads mel rows up to `2 * out_rows`."
params = [
  { name = "mel", kind = "in", elem = "f32", len = "(2 * out_rows + 1) * bins" },
  { name = "bins", kind = "scalar", type = "i32" },
  { name = "weight", kind = "in", elem = "f32", len = "channels * 9" },
  { name = "bias", kind = "in", elem = "f32", len = "channels" },
  { name = "channels", kind = "scalar", type = "i32" },
  { name = "out", kind = "out", elem = "f16", len = "out_rows * out_freq * channels" },
  { name = "out_rows", kind = "scalar", type = "i32" },
  { name = "out_freq", kind = "scalar", type = "i32" },
]
# One thread per channel; the block stages the three rows' columns.
requires = ["channels >= 1", "channels <= 1024", "(2 * out_rows + 1) * bins <= 2147483647"]
probes = [
  { bins = 128, channels = 256, out_rows = 5, out_freq = 65 },
  { bins = 20, channels = 3, out_rows = 1, out_freq = 11 },
  { bins = 128, channels = 256, out_rows = 0, out_freq = 65 },
]

[[launcher]]
name = "subsample_depthwise"
cpp = "SubsampleDepthwise"
returns = "void"
doc = "A depthwise 3x3 stride-2 convolution of float16 `[rows][in_freq][channels]` plus bias (frequency padded like the stem), summed in float32: `out [out_rows][out_freq][channels]` as float16; reads input rows up to `2 * out_rows`."
params = [
  { name = "input", kind = "in", elem = "f16", len = "(2 * out_rows + 1) * in_freq * channels" },
  { name = "in_freq", kind = "scalar", type = "i32" },
  { name = "weight", kind = "in", elem = "f32", len = "channels * 9" },
  { name = "bias", kind = "in", elem = "f32", len = "channels" },
  { name = "channels", kind = "scalar", type = "i32" },
  { name = "out", kind = "out", elem = "f16", len = "out_rows * out_freq * channels" },
  { name = "out_rows", kind = "scalar", type = "i32" },
  { name = "out_freq", kind = "scalar", type = "i32" },
]
# A thread per pair of channels (16-bit pairs).
requires = ["channels % 2 == 0", "(2 * out_rows + 1) * in_freq * channels <= 2147483647"]
probes = [
  { in_freq = 65, channels = 256, out_rows = 4, out_freq = 33 },
  { in_freq = 9, channels = 6, out_rows = 1, out_freq = 5 },
  { in_freq = 65, channels = 256, out_rows = 0, out_freq = 33 },
]

