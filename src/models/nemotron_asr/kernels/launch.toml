# --- Self-attention and the convolution module --------------------------------

[[launcher]]
name = "rel_pos_attention_half"
cpp = "RelPosAttentionHalfFlat"
returns = "supported"
doc = "Transformer-XL attention with chunked limited context over heads of 128 dimensions: a query (absolute frame `first_query + t`) attends to the keys from `left` frames before its chunk to the chunk's end, at most the pass's last, with scores `((q + u) . k + (q + v) . pos[pos_zero + query - key]) * scale`. Queries, keys and values are `qkv` rows `[q | k | v]` (`q_stride` apart), earlier keys and values the caches' rows (frames `first_key` to `first_query - 1`). The products take float16 operands with float32 sums, one block per group of chunks (as many whole chunks as fit in 16 queries, or one chunk in tiles of 16) and head; the softmax is float32 and the output `[queries][heads * 128]` float16. Rows are read as float4: unsupported (nothing launched) unless `qkv`, the caches and `pos` are 16-byte aligned."
params = [
  { name = "qkv", kind = "in", elem = "f32", len = "queries * q_stride" },
  { name = "cache_keys", kind = "in", elem = "f32", len = "(first_query - first_key) * heads * 128" },
  { name = "cache_values", kind = "in", elem = "f32", len = "(first_query - first_key) * heads * 128" },
  { name = "pos", kind = "in", elem = "f32", len = "pos_rows * heads * 128" },
  { name = "bias_u", kind = "in", elem = "f32", len = "heads * 128" },
  { name = "bias_v", kind = "in", elem = "f32", len = "heads * 128" },
  { name = "out", kind = "out", elem = "f16", len = "queries * heads * 128" },
  { name = "queries", kind = "scalar", type = "i32" },
  { name = "heads", kind = "scalar", type = "i32" },
  { name = "q_stride", kind = "scalar", type = "i32" },
  { name = "first_query", kind = "scalar", type = "usize" },
  { name = "first_key", kind = "scalar", type = "usize" },
  { name = "chunk", kind = "scalar", type = "i32" },
  { name = "left", kind = "scalar", type = "i32" },
  { name = "pos_zero", kind = "scalar", type = "i32" },
  { name = "pos_rows", kind = "scalar", type = "i32" },
  { name = "scale", kind = "scalar", type = "f32" },
]
# Keys sit within `left` frames before a query's chunk start and before its
# chunk end: distances from -(chunk - 1) to left + chunk - 1, rows of `pos`
# around `pos_zero`; a group's distances beyond them (keys outside every
# query's window) read the table's first or last row. The launcher throws
# for a window beyond 256 keys, a table shorter than the window and
# misaligned rows, none of which may cross into Rust: the requires rule out
# the first two, the adapter declines the third.
requires = [
  "first_key <= first_query",
  "q_stride >= 3 * heads * 128",
  "q_stride % 4 == 0",
  "chunk >= 1",
  "chunk <= pos_zero + 1",
  "pos_zero + left + chunk <= pos_rows",
  "left + chunk <= 256",
  "first_query + queries <= 2147483647",
]
probes = [
  { queries = 14, heads = 2, q_stride = 768, first_query = 0, first_key = 0, chunk = 14, left = 56, pos_zero = 13, pos_rows = 83, scale = 0.088 },
  { queries = 28, heads = 1, q_stride = 384, first_query = 70, first_key = 14, chunk = 14, left = 56, pos_zero = 13, pos_rows = 83, scale = 0.088 },
  { queries = 5, heads = 1, q_stride = 400, first_query = 3, first_key = 0, chunk = 1, left = 56, pos_zero = 13, pos_rows = 83, scale = 0.088 },
  { queries = 30, heads = 1, q_stride = 384, first_query = 10, first_key = 0, chunk = 4, left = 56, pos_zero = 13, pos_rows = 83, scale = 0.088 },
  { queries = 40, heads = 1, q_stride = 384, first_query = 20, first_key = 0, chunk = 28, left = 56, pos_zero = 27, pos_rows = 111, scale = 0.088 },
  { queries = 0, heads = 1, q_stride = 384, first_query = 0, first_key = 0, chunk = 4, left = 56, pos_zero = 13, pos_rows = 83, scale = 0.088 },
]

[[launcher]]
name = "update_key_value_cache"
cpp = "UpdateKeyValueCacheFlat"
returns = "void"
doc = "Keeps the last `keep` key and value rows of `[cache (cached rows) | the pass's rows qkv rows]` in the caches (`capacity` rows of `width`); qkv rows hold keys at column `width`, values at `2 * width`."
params = [
  { name = "keys", kind = "inout", elem = "f32", len = "capacity * width" },
  { name = "values", kind = "inout", elem = "f32", len = "capacity * width" },
  { name = "qkv", kind = "in", elem = "f32", len = "rows * stride" },
  { name = "stride", kind = "scalar", type = "i32" },
  { name = "cached", kind = "scalar", type = "i32" },
  { name = "rows", kind = "scalar", type = "i32" },
  { name = "keep", kind = "scalar", type = "i32" },
  { name = "width", kind = "scalar", type = "i32" },
  { name = "capacity", kind = "scalar", type = "i32" },
]
requires = ["width >= 1", "stride >= 3 * width", "cached <= capacity", "keep <= capacity", "keep <= cached + rows"]
probes = [
  { stride = 768, cached = 0, rows = 14, keep = 14, width = 256, capacity = 56 },
  { stride = 768, cached = 56, rows = 14, keep = 56, width = 256, capacity = 56 },
  { stride = 30, cached = 3, rows = 2, keep = 4, width = 10, capacity = 6 },
  { stride = 30, cached = 3, rows = 0, keep = 0, width = 10, capacity = 6 },
]

[[launcher]]
name = "glu_depthwise"
cpp = "GluDepthwise"
returns = "void"
doc = "The convolution module's GLU and causal depthwise convolution: `in` is `[rows][2 * channels]`, `cache` the GLU of the `kernel - 1` rows before it, `out [rows][channels]`."
params = [
  { name = "input", kind = "in", elem = "f32", len = "rows * 2 * channels" },
  { name = "cache", kind = "in", elem = "f32", len = "(kernel - 1) * channels" },
  { name = "weight", kind = "in", elem = "f32", len = "channels * kernel" },
  { name = "out", kind = "out", elem = "f32", len = "rows * channels" },
  { name = "rows", kind = "scalar", type = "i32" },
  { name = "channels", kind = "scalar", type = "i32" },
  { name = "kernel", kind = "scalar", type = "i32" },
]
requires = ["kernel >= 1"]
probes = [{ rows = 14, channels = 1024, kernel = 9 }, { rows = 2, channels = 3, kernel = 9 }, { rows = 0, channels = 3, kernel = 9 }]

[[launcher]]
name = "update_conv_cache"
cpp = "UpdateConvCache"
returns = "void"
doc = "Replaces `cache` (`kernel - 1` rows) with the GLU of the last `kernel - 1` rows of `[cache | in]`."
params = [
  { name = "input", kind = "in", elem = "f32", len = "rows * 2 * channels" },
  { name = "cache", kind = "inout", elem = "f32", len = "(kernel - 1) * channels" },
  { name = "rows", kind = "scalar", type = "i32" },
  { name = "channels", kind = "scalar", type = "i32" },
  { name = "kernel", kind = "scalar", type = "i32" },
]
# The grid needs a channel.
requires = ["kernel >= 1", "channels >= 1"]
probes = [{ rows = 14, channels = 1024, kernel = 9 }, { rows = 2, channels = 3, kernel = 9 }, { rows = 0, channels = 3, kernel = 9 }]

# --- Prediction and joint networks --------------------------------------------

[[launcher]]
name = "gemv"
cpp = "Gemv"
returns = "void"
doc = "`y[r] = W[r] . concat(x1, x2) + bias[r]` for `rows` float16 rows of `k1 + k2` values (`x2` unread for `k2` 0); an absent bias adds nothing."
params = [
  { name = "weight", kind = "in", elem = "f16", len = "rows * (k1 + k2)" },
  { name = "x1", kind = "in", elem = "f32", len = "k1" },
  { name = "k1", kind = "scalar", type = "i32" },
  { name = "x2", kind = "in", elem = "f32", len = "k2" },
  { name = "k2", kind = "scalar", type = "i32" },
  { name = "bias", kind = "in", elem = "f32", len = "rows", optional = true },
  { name = "y", kind = "out", elem = "f32", len = "rows" },
  { name = "rows", kind = "scalar", type = "i32" },
]
# Lanes read eight values at a time (16-byte loads); the grid needs a row.
requires = ["k1 % 8 == 0", "k2 % 8 == 0", "rows >= 1"]
probes = [
  { k1 = 640, k2 = 640, rows = 2560, with = ["bias"] },
  { k1 = 640, k2 = 0, rows = 640, with = ["bias"] },
  { k1 = 8, k2 = 16, rows = 3 },
]

[[launcher]]
name = "lstm_cell"
cpp = "LstmCell"
returns = "void"
doc = "PyTorch's LSTM cell from gates `[i | f | g | o]` (each `hidden` wide): updates `c` and writes `h`."
