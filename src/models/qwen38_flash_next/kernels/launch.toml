name = "mmq_moe_tiled"
cpp = "MmqMoeTiled"
returns = "supported"
doc = "Tiled routed projection out[t][s] = W[ids[t][s]] . x[t] with the column-grid hints (largest bucket, tile width; 0 for none)."
params = [
  { name = "weight_type", kind = "format", of = "w" },
  { name = "w", kind = "quant", rows = "n_experts * m", cols = "k", formats = ["Q4_K", "Q5_K", "Q5_1", "Q8_0"], tail = "4096" },
  { name = "x", kind = "in", elem = "f32", len = "n_tokens * k" },
  { name = "ids", kind = "indices", signed = true, padded = true, len = "n_tokens * n_used", below = "n_experts" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * n_used * m" },
  { name = "m", kind = "scalar", type = "u32" },
  { name = "k", kind = "scalar", type = "u32" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "n_experts", kind = "scalar", type = "u32" },
  { name = "n_used", kind = "scalar", type = "u32" },
  { name = "max_rows", kind = "scalar", type = "u32" },
  { name = "tile_cols", kind = "scalar", type = "u32" },
  # Source and destination row maps, expert bounds and the gathered Q8_1
  # rows with the widest column tile's padding.
  { name = "scratch", kind = "out", elem = "bytes", len = "scratch_bytes" },
  { name = "scratch_bytes", kind = "scalar", type = "usize" },
]
requires = ["scratch_bytes >= (n_tokens * n_used * 4 + 255) / 256 * 256 * 2 + ((n_experts + 1) * 4 + 255) / 256 * 256 + (n_tokens * n_used * ((k + 511) / 512 * 512) * 144 / 128 + 128 * 144 + 255) / 256 * 256"]
probes = [
  { w = "Q4_K", m = 640, k = 2560, n_tokens = 40, n_experts = 4, n_used = 2, max_rows = 0, tile_cols = 0, scratch_bytes = 4194304 },
  { w = "Q8_0", m = 2560, k = 640, n_tokens = 80, n_experts = 3, n_used = 1, max_rows = 80, tile_cols = 48, scratch_bytes = 4194304 },
]

