# --- Gated DeltaNet (128-wide heads) ---------------------------------------------
# channels = 2 * k_heads * 128 + v_heads * 128 (q | k | v of the conv input).
# Rollback rows: the first holds the full state [v_heads][128][128] and the
# conv history [kernel - 1][channels]; each later one the step's keys,
# decays, betas and errors (k_heads * 128 + v_heads * 130) and the history.

