# Kernel contract for Qwen3.8-Flash-Next (qwen4exp) (docs/RUST.md).
# Extents are element counts; the C++ launcher takes `hipStream_t` last
# unless a `stream` parameter places it.
# Trusted base: a wrong extent compiles and lets a kernel overrun its buffer.
# Review changes like unsafe code; every launcher needs probes (tests/extents.rs).
#
# Recurring layouts:
# - Tiled Q8 activations of `batch` rows of `k` values (Q8TiledBytes): whole
#   128-token macro tiles, ((batch + 127) / 128) * 8 * (k / 32) * 576 bytes.
# - Q8_1 activations of the quantized tier (qfn_mmq_q8_1_bytes): rows padded
#   to 512 values, n * ((k + 511) / 512 * 512) / 32 * 36 bytes.
# - Inject partial sums: (hidden + 255) / 256 per logit for the scalar mixer
#   epilogue, (hidden / 4 + 255) / 256 for the four-lane forms.
# - Positions come from the session's device control block. A launch that
#   writes or reads rows position .. position + n_tokens of a cache holding
#   `max_context` rows takes the position below max_context - n_tokens + 1.

[library]
name = "qwen38_flash_next"
root = "../../../.."
namespace = "gufo::models::qwen38_flash_next::rocm"
format_type = "gufo::models::qwen38_flash_next::rocm::WeightType"
f16_type = "__half"
headers = [
  "src/models/qwen38_flash_next/kernels/rocm/kernels.hpp",
  "src/models/qwen38_flash_next/kernels/adapters.hpp",
]

# The model kernels keep the C++ build's flags (CMakeLists.txt).
[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/kernels.hip.cpp"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument"]
defines = ["QFN_ROCM_BUILD=1"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/w8a8_wave64.hip"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-command-line-argument", "-mwavefrontsize64"]
defines = ["QFN_ROCM_BUILD=1"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/adapters.hip"

# The quantized GEMM tier adapted from llama.cpp keeps its C++17 dialect.
[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/qfn_ggml_stubs.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["GGML_HIP_NO_VMM"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/qfn_mmq.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["GGML_HIP_NO_VMM"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/mmid.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["GGML_HIP_NO_VMM"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/mmvq.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["GGML_HIP_NO_VMM"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/moe_wave64.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument", "-mwavefrontsize64"]
defines = ["GGML_HIP_NO_VMM"]

[[source]]
path = "src/models/qwen38_flash_next/kernels/rocm/mmq/quantize.hip.cpp"
std = "c++17"
flags = ["-O3", "-ffast-math", "-fno-finite-math-only", "-Wno-unused-value", "-Wno-unused-command-line-argument"]
defines = ["GGML_HIP_NO_VMM"]


# --- Embedding, norms and hyper-connections ----------------------------------

[[launcher]]
name = "embed_tokens"
cpp = "EmbedTokens"
returns = "void"
doc = "res[t][s] = table[tokens[t]] for every stream s, decoded to f32."
params = [
  { name = "table", kind = "quant", rows = "rows", cols = "hidden", formats = ["F32", "F16", "BF16", "Q8_0"] },
  { name = "weight_type", kind = "format", of = "table" },
  { name = "tokens", kind = "indices", signed = true, len = "n_tokens", below = "rows" },
  { name = "res", kind = "out", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "hidden", kind = "scalar", type = "u32" },
  { name = "streams", kind = "scalar", type = "u32" },
  { name = "rows", kind = "scalar", type = "u32", contract_only = true },
]
probes = [
  { table = "Q8_0", n_tokens = 3, hidden = 2560, streams = 4, rows = 5 },
  { table = "F32", n_tokens = 2, hidden = 7, streams = 1, rows = 2 },
]

[[launcher]]
name = "rms_norm_rows"
cpp = "RmsNormRows"
returns = "void"
doc = "out[r] = rmsnorm(x[r]) * gamma over `groups` groups of dim / groups values that share the gamma row."
params = [
  { name = "x", kind = "in", elem = "f32", len = "n_rows * dim" },
  { name = "gamma", kind = "in", elem = "f32", len = "dim" },
  { name = "out", kind = "out", elem = "f32", len = "n_rows * dim" },
  { name = "n_rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "groups", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["groups >= 1", "dim % groups == 0"]
probes = [
  { n_rows = 3, dim = 10240, groups = 4, eps = 1e-6 },
  { n_rows = 2, dim = 300, groups = 1, eps = 1e-6 },
]

[[launcher]]
name = "rms_norm_rows_in_place"
cpp = "RmsNormRows"
returns = "void"
doc = "rms_norm_rows over `x` in place."
params = [
  { name = "input", kind = "alias", of = "x", elem = "f32", read_only = true },
  { name = "gamma", kind = "in", elem = "f32", len = "dim" },
  { name = "x", kind = "inout", elem = "f32", len = "n_rows * dim" },
  { name = "n_rows", kind = "scalar", type = "u32" },
  { name = "dim", kind = "scalar", type = "u32" },
  { name = "groups", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
]
requires = ["groups >= 1", "dim % groups == 0"]
probes = [
  { n_rows = 48, dim = 256, groups = 1, eps = 1e-6 },
  { n_rows = 1, dim = 10240, groups = 4, eps = 1e-6 },
]

[[launcher]]
name = "hc_mix_epilogue"
cpp = "HcMixEpilogue"
returns = "void"
doc = "mixed[t] = mean_s xn[t][s] * sigmoid(gate[t][s]) (up to eight streams)."
params = [
  { name = "xn", kind = "in", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "gate", kind = "in", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "inject_w", kind = "const", cpp_type = "const float*", value = "nullptr" },
  { name = "mixed", kind = "out", elem = "f32", len = "n_tokens * hidden" },
  { name = "inject", kind = "const", cpp_type = "float*", value = "nullptr" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "hidden", kind = "scalar", type = "u32" },
  { name = "streams", kind = "scalar", type = "u32" },
  { name = "stream", kind = "stream" },
  { name = "mixed_q8", kind = "const", cpp_type = "void*", value = "nullptr" },
]
requires = ["streams >= 1", "streams <= 8"]
probes = [
  { n_tokens = 3, hidden = 2560, streams = 4 },
  { n_tokens = 1, hidden = 300, streams = 8 },
]

[[launcher]]
name = "hc_mix_epilogue_inject"
cpp = "HcMixEpilogue"
returns = "void"
doc = "hc_mix_epilogue plus the inject logits' partial sums inject[t][s][part] = dot(inject_w[s], xn[t]) over each 256-wide part."
params = [
  { name = "xn", kind = "in", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "gate", kind = "in", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "inject_w", kind = "in", elem = "f32", len = "streams * streams * hidden" },
  { name = "mixed", kind = "out", elem = "f32", len = "n_tokens * hidden" },
  { name = "inject", kind = "out", elem = "f32", len = "n_tokens * streams * ((hidden + 255) / 256)" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "hidden", kind = "scalar", type = "u32" },
  { name = "streams", kind = "scalar", type = "u32" },
  { name = "stream", kind = "stream" },
  { name = "mixed_q8", kind = "const", cpp_type = "void*", value = "nullptr" },
]
requires = ["streams >= 1", "streams <= 8"]
probes = [
  { n_tokens = 3, hidden = 2560, streams = 4 },
  { n_tokens = 1, hidden = 300, streams = 8 },
