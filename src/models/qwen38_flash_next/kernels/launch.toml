  { name = "a", kind = "in", elem = "f32", len = "v_heads" },
  { name = "dt", kind = "in", elem = "f32", len = "v_heads" },
  { name = "norm_w", kind = "in", elem = "f32", len = "128" },
  { name = "conv_state", kind = "inout", elem = "f32", len = "(kernel - 1) * (2 * k_heads * 128 + v_heads * 128)" },
  { name = "conv_scratch", kind = "inout", elem = "f32", len = "(n_tokens + kernel - 1) * (2 * k_heads * 128 + v_heads * 128)" },
  { name = "qn", kind = "out", elem = "f32", len = "n_tokens * k_heads * 128" },
  { name = "kn", kind = "out", elem = "f32", len = "n_tokens * k_heads * 128" },
  { name = "raw_rows", kind = "out", elem = "f32", len = "n_tokens * v_heads * 128" },
  { name = "state", kind = "inout", elem = "f32", len = "v_heads * 128 * 128" },
  { name = "out", kind = "out", elem = "f32", len = "n_tokens * v_heads * 128" },
  { name = "out_q8", kind = "const", cpp_type = "void*", value = "nullptr" },
  { name = "out_half", kind = "const", cpp_type = "__half*", value = "nullptr" },
