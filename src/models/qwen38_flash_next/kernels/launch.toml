[[launcher]]
name = "hc_combine"
cpp = "HcCombine"
returns = "void"
doc = "res[t][s] += block_out[t] * 2 sigmoid(sum(inject[t][s]) / streams); with gamma also the next mixer's grouped norm of res into xn."
params = [
  { name = "res", kind = "inout", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "block_out", kind = "in", elem = "f32", len = "n_tokens * hidden" },
  { name = "inject", kind = "in", elem = "f32", len = "n_tokens * streams * inject_parts" },
  { name = "inject_parts", kind = "scalar", type = "u32" },
  { name = "gamma", kind = "in", elem = "f32", len = "streams * hidden", optional = true },
  { name = "xn", kind = "out", elem = "f32", len = "n_tokens * streams * hidden" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "hidden", kind = "scalar", type = "u32" },
  { name = "streams", kind = "scalar", type = "u32" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "stream", kind = "stream" },
  { name = "decode", kind = "scalar", type = "bool" },
]
requires = ["streams >= 1"]
probes = [
  { n_tokens = 17, hidden = 2560, streams = 4, inject_parts = 3, eps = 1e-6, decode = false, with = ["gamma"] },
  { n_tokens = 3, hidden = 300, streams = 2, inject_parts = 1, eps = 1e-6, decode = true, with = ["gamma"] },
  { n_tokens = 2, hidden = 256, streams = 4, inject_parts = 1, eps = 1e-6, decode = false },
]

