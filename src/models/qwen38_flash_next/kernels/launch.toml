params = [
  { name = "qkv", kind = "in", elem = "f32", len = "(n_tokens - 1) * qkv_stride + 2 * k_heads * 128 + v_heads * 128" },
  { name = "qkv_stride", kind = "scalar", type = "u32" },
  { name = "z", kind = "in", elem = "f32", len = "(n_tokens - 1) * z_stride + v_heads * 128" },
