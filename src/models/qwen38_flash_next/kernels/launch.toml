  { name = "state_rest", kind = "out", elem = "f32", list = "rest", len = "k_heads * 128 + v_heads * 130" },
  { name = "conv_rest", kind = "out", elem = "f32", list = "rest", len = "(kernel - 1) * (2 * k_heads * 128 + v_heads * 128)" },
  { name = "rest", kind = "scalar", type = "u32" },
  { name = "n_tokens", kind = "scalar", type = "u32" },
  { name = "k_heads", kind = "scalar", type = "u32" },
  { name = "v_heads", kind = "scalar", type = "u32" },
  { name = "kernel", kind = "scalar", type = "u32" },
  { name = "row_split", kind = "scalar", type = "bool" },
  { name = "convolved", kind = "scalar", type = "bool" },
  { name = "eps", kind = "scalar", type = "f32" },
  { name = "out_half_stride", kind = "const", cpp_type = "std::uint32_t", value = "0" },
